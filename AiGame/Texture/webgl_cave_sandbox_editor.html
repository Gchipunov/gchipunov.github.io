<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Cave Sandbox Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <!-- Load OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #canvas-container { width: 100%; height: 100%; display: block; }
        
        /* Custom scrollbar for sidebar if needed */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        /* UI Theme Overrides for a slightly older engine feel */
        .engine-btn {
            background: linear-gradient(to bottom, #374151, #1f2937);
            border: 1px solid #4b5563;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
            transition: all 0.1s ease;
        }
        .engine-btn:hover {
            background: linear-gradient(to bottom, #4b5563, #374151);
        }
        .engine-btn:active {
            background: #111827;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="flex h-screen w-screen text-gray-300 font-sans antialiased overflow-hidden select-none">

    <!-- Sidebar Editor Panel -->
    <div class="w-72 bg-gray-900 border-r border-gray-700 flex flex-col shadow-xl z-10">
        <!-- Header -->
        <div class="p-4 border-b border-gray-800 bg-gray-950">
            <h1 class="text-lg font-bold text-gray-100 tracking-wider flex items-center gap-2">
                <svg class="w-5 h-5 text-orange-500" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd" />
                </svg>
                CaveBuilder Pro
            </h1>
            <p class="text-xs text-gray-500 mt-1">v0.1 Prototype</p>
        </div>

        <!-- Tools Section -->
        <div class="p-4 flex-1 overflow-y-auto flex flex-col gap-6">
            
            <!-- Build Tools -->
            <div>
                <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Geometry</h2>
                <div class="flex flex-col gap-2">
                    <button id="btnAddRock" class="engine-btn text-left px-4 py-2 rounded text-sm text-gray-200 flex items-center gap-2">
                        <svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                        Add Rock Block
                    </button>
                    <button id="btnAddVideo" class="engine-btn text-left px-4 py-2 rounded text-sm text-gray-200 flex items-center gap-2">
                        <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        Add Video Viewer
                    </button>
                </div>
            </div>

            <!-- Export Tools -->
            <div>
                <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Pipeline</h2>
                <div class="flex flex-col gap-2">
                    <button id="btnExportVMF" class="engine-btn text-left px-4 py-2 rounded text-sm text-gray-200 flex items-center gap-2">
                        <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Export to VMF (Source1)
                    </button>
                    <button id="btnExportSMD" class="engine-btn text-left px-4 py-2 rounded text-sm text-gray-200 flex items-center gap-2">
                        <svg class="w-4 h-4 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        Export to SMD
                    </button>
                </div>
            </div>
            
            <div class="mt-auto pt-4 border-t border-gray-800">
                <p class="text-[10px] text-gray-600 leading-tight">Controls:<br>Left Click - Rotate<br>Right Click - Pan<br>Scroll - Zoom</p>
            </div>
        </div>
    </div>

    <!-- Main 3D Viewport -->
    <div class="flex-1 relative bg-black">
        <!-- Canvas Container -->
        <div id="canvas-container" class="absolute inset-0 cursor-crosshair"></div>
        
        <!-- Viewport Overlays -->
        <div class="absolute top-4 left-4 pointer-events-none">
            <span class="bg-black bg-opacity-50 text-gray-400 text-xs px-2 py-1 rounded border border-gray-800 font-mono">Perspective</span>
        </div>
        <div class="absolute bottom-4 right-4 pointer-events-none">
            <span class="bg-black bg-opacity-50 text-gray-500 text-xs px-2 py-1 rounded border border-gray-800 font-mono">WebGL Render</span>
        </div>
    </div>

    <!-- Custom Modal for Notifications (Replacing alert) -->
    <div id="customModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70 hidden">
        <div class="bg-gray-800 border border-gray-600 rounded-lg shadow-2xl p-6 max-w-sm w-full mx-4 transform transition-all">
            <h3 id="modalTitle" class="text-lg font-bold text-white mb-2">Notification</h3>
            <p id="modalMessage" class="text-sm text-gray-300 mb-6 whitespace-pre-wrap"></p>
            <div class="flex justify-end">
                <button id="btnModalClose" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-sm transition-colors focus:outline-none">
                    Acknowledge
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Custom Modal Logic ---
        const modal = document.getElementById('customModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const btnModalClose = document.getElementById('btnModalClose');

        function showMessage(title, message) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modal.classList.remove('hidden');
        }

        btnModalClose.addEventListener('click', () => {
            modal.classList.add('hidden');
        });

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        
        // Scene with dark, cave-like fog
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a); // Very dark gray
        scene.fog = new THREE.FogExp2(0x0a0a0a, 0.04); // Atmospheric fog

        // Camera
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(5, 5, 8);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 50;

        // Lighting (Dim, atmospheric)
        const ambientLight = new THREE.AmbientLight(0x222222); // Very low ambient
        scene.add(ambientLight);

        // Main point light acting like a central torch or work light
        const pointLight = new THREE.PointLight(0xffa95c, 1.5, 50); // Warm orange-ish light
        pointLight.position.set(0, 5, 0);
        pointLight.castShadow = true;
        pointLight.shadow.mapSize.width = 1024;
        pointLight.shadow.mapSize.height = 1024;
        scene.add(pointLight);

        // Add a subtle blueish rim light for contrast
        const rimLight = new THREE.PointLight(0x445588, 0.8, 40);
        rimLight.position.set(-10, 2, -10);
        scene.add(rimLight);

        // Grid Helper (styled to look like a tool)
        const gridHelper = new THREE.GridHelper(40, 40, 0x444444, 0x222222);
        gridHelper.position.y = -0.01; // Slightly below zero to avoid z-fighting with objects on floor
        scene.add(gridHelper);

        // Base floor plane to catch shadows
        const floorGeo = new THREE.PlaneGeometry(40, 40);
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x111111, 
            roughness: 0.9,
            metalness: 0.1
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- Tool Logic ---

        // 1. Add Rock Block
        document.getElementById('btnAddRock').addEventListener('click', () => {
            // Irregular box geometry to look slightly more like a blocky rock
            const width = 1.5 + Math.random();
            const height = 1.5 + Math.random();
            const depth = 1.5 + Math.random();
            const geometry = new THREE.BoxGeometry(width, height, depth);
            
            // Generate a cave-like brown/gray color
            const color = new THREE.Color().setHSL(
                0.05 + (Math.random() * 0.05), // Hue: brownish
                0.3 + (Math.random() * 0.2),   // Saturation
                0.15 + (Math.random() * 0.1)   // Lightness: dark
            );

            const material = new THREE.MeshStandardMaterial({ 
                color: color,
                roughness: 0.8 + Math.random() * 0.2,
                metalness: 0.1
            });
            
            const rock = new THREE.Mesh(geometry, material);
            rock.castShadow = true;
            rock.receiveShadow = true;

            // Randomize position near center
            rock.position.set(
                (Math.random() - 0.5) * 10,
                height / 2, // Sit on the floor roughly
                (Math.random() - 0.5) * 10
            );
            
            // Randomize rotation slightly
            rock.rotation.set(
                Math.random() * 0.2,
                Math.random() * Math.PI,
                Math.random() * 0.2
            );

            scene.add(rock);
            
            // Focus camera slightly towards the new object
            // controls.target.copy(rock.position);
        });

        // 2. Add Video Viewer
        document.getElementById('btnAddVideo').addEventListener('click', () => {
            // Create hidden video element
            const video = document.createElement('video');
            // Using a reliable sample video (Big Buck Bunny)
            video.src = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';
            video.crossOrigin = 'anonymous'; // Important for WebGL textures
            video.loop = true;
            video.muted = true; // Must be muted to autoplay without user interaction in most browsers
            video.play().catch(e => console.error("Video play failed:", e));

            // Create video texture
            const videoTexture = new THREE.VideoTexture(video);
            videoTexture.minFilter = THREE.LinearFilter;
            videoTexture.magFilter = THREE.LinearFilter;
            videoTexture.format = THREE.RGBFormat;

            // Create plane to display video (16:9 aspect ratio roughly)
            const geometry = new THREE.PlaneGeometry(6, 6 * (9/16));
            
            // Use Basic material so it glows in the dark cave
            const material = new THREE.MeshBasicMaterial({ 
                map: videoTexture,
                side: THREE.DoubleSide
            });
            
            const screen = new THREE.Mesh(geometry, material);
            
            // Position it floating
            screen.position.set(
                (Math.random() - 0.5) * 8,
                3,
                (Math.random() - 0.5) * 8
            );
            
            // Make it face the camera initially
            screen.lookAt(camera.position);

            scene.add(screen);
            
            showMessage("Video Viewer Added", "A screen rendering an HTML5 video has been added to the scene. It acts as an unlit emissive surface.");
        });

        // 3. Export to VMF
        document.getElementById('btnExportVMF').addEventListener('click', () => {
            const rockCount = scene.children.filter(c => c.geometry && c.geometry.type === 'BoxGeometry').length;
            const screenCount = scene.children.filter(c => c.geometry && c.geometry.type === 'PlaneGeometry' && c !== floor).length;
            
            const dummyVmfData = `
// Simulated VMF Export
versioninfo
{
    "editorversion" "400"
    "editorbuild" "8896"
    "mapversion" "1"
    "formatversion" "100"
    "prefab" "0"
}
world
{
    "id" "1"
    "mapversion" "1"
    "classname" "worldspawn"
    "skyname" "sky_day01_01"
}
// Found ${rockCount} static props (rocks)
// Found ${screenCount} func_monitor entities
... [Data truncated for prototype] ...
            `.trim();

            showMessage("VMF Export Successful", `Generated Source1 Valve Map Format data.\n\n${dummyVmfData}`);
        });

        // 4. Export to SMD
        document.getElementById('btnExportSMD').addEventListener('click', () => {
            const dummySmdData = `
// Simulated SMD Export
version 1
nodes
0 "root" -1
end
skeleton
time 0
0 0.000000 0.000000 0.000000 1.570796 0.000000 0.000000
end
triangles
// Extracted geometry data...
// Prototype mode: geometry not serialized.
end
            `.trim();

            showMessage("SMD Export Successful", `Generated Studio Model Data for compilation.\n\n${dummySmdData}`);
        });


        // --- Window Resize Handling ---
        window.addEventListener('resize', onWindowResize, false);

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            // Update controls
            controls.update();

            // Optional: Add some slight flicker to the main point light to simulate a torch/fire
            const time = Date.now() * 0.005;
            pointLight.intensity = 1.5 + Math.sin(time) * 0.1 + Math.random() * 0.05;

            // Render scene
            renderer.render(scene, camera);
        }

        // Initialize animation loop
        window.onload = function() {
            animate();
            
            // Initial greeting
            setTimeout(() => {
                showMessage("Editor Initialized", "Welcome to the CaveBuilder Sandbox.\nUse the left panel to spawn geometry and video textures.\nLeft click to rotate camera, right click to pan.");
            }, 500);
        };

    </script>
</body>
</html>
