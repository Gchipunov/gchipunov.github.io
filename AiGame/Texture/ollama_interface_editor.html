<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Interface Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Scrollbar for IDE feel */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937; 
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280; 
        }
        
        .streaming-cursor::after {
            content: '▋';
            display: inline-block;
            animation: blink 1s step-start infinite;
            color: #10b981; /* Emerald-500 */
            margin-left: 2px;
        }
        
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 font-sans h-screen flex flex-col overflow-hidden selection:bg-blue-600 selection:text-white">

    <!-- Header / IP Local Agent -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 flex flex-col sm:flex-row items-center justify-between shadow-md z-10 shrink-0">
        <div class="flex items-center gap-3 mb-4 sm:mb-0">
            <svg class="w-6 h-6 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path>
            </svg>
            <h1 class="text-xl font-bold tracking-wider">OLLAMA<span class="text-emerald-500 font-light">IDE</span></h1>
        </div>
        
        <div class="flex flex-col sm:flex-row items-center gap-3 w-full sm:w-auto">
            <input type="text" id="serverUrl" value="http://localhost:11434" class="bg-gray-900 border border-gray-600 text-sm rounded-md px-3 py-1.5 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 w-full sm:w-64" placeholder="Ollama URL">
            <button id="connectBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium py-1.5 px-4 rounded-md transition-colors w-full sm:w-auto whitespace-nowrap shadow-sm">
                Connect & Fetch
            </button>
            <select id="modelSelector" class="bg-gray-900 border border-gray-600 text-sm rounded-md px-3 py-1.5 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 w-full sm:w-48 appearance-none disabled:opacity-50" disabled>
                <option value="">No models loaded</option>
            </select>
        </div>
    </header>

    <!-- Error/Notification Banner -->
    <div id="notificationBanner" class="hidden bg-red-900/50 border-l-4 border-red-500 text-red-200 p-3 mx-4 mt-4 rounded shadow-sm text-sm shrink-0">
        <div class="flex justify-between items-start">
            <div id="notificationMessage"></div>
            <button onclick="document.getElementById('notificationBanner').classList.add('hidden')" class="text-red-400 hover:text-red-200">&times;</button>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex flex-1 overflow-hidden flex-col md:flex-row">
        
        <!-- Left Panel: Editor & Variables -->
        <main class="flex-1 flex flex-col p-4 gap-4 overflow-y-auto">
            
            <!-- Struct Variables Section -->
            <section class="bg-gray-800 rounded-lg border border-gray-700 shadow-sm flex flex-col shrink-0">
                <div class="bg-gray-700/50 p-3 border-b border-gray-700 flex justify-between items-center rounded-t-lg">
                    <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400">Struct Variables</h2>
                    <button id="addVarBtn" class="text-xs bg-gray-600 hover:bg-gray-500 text-gray-200 px-2 py-1 rounded transition-colors flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Add Variable
                    </button>
                </div>
                <div id="variablesContainer" class="p-4 flex flex-col gap-3">
                    <!-- Variables injected via JS -->
                </div>
            </section>

            <!-- Prompt Editor Section -->
            <section class="bg-gray-800 rounded-lg border border-gray-700 shadow-sm flex flex-col flex-1 min-h-[300px]">
                <div class="bg-gray-700/50 p-3 border-b border-gray-700 rounded-t-lg flex justify-between items-center">
                    <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400">Prompt Editor</h2>
                </div>
                <div class="flex-1 p-4 flex flex-col">
                    <textarea id="promptInput" class="flex-1 bg-gray-900 border border-gray-700 rounded-md p-3 text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 resize-none font-mono" placeholder="Type your prompt here..."></textarea>
                    
                    <div class="mt-4 flex justify-end">
                        <button id="runJobBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-6 rounded-md transition-colors flex items-center gap-2 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                            Run Job
                        </button>
                    </div>
                </div>
            </section>

        </main>

        <!-- Right Panel: Jobs Management -->
        <aside class="w-full md:w-96 bg-gray-800 border-l border-gray-700 flex flex-col shrink-0 md:h-full h-80">
            <div class="bg-gray-900/50 p-4 border-b border-gray-700 flex justify-between items-center shrink-0">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400">Jobs History</h2>
                <span id="jobCount" class="bg-gray-700 text-xs py-0.5 px-2 rounded-full">0</span>
            </div>
            
            <div id="jobsContainer" class="flex-1 overflow-y-auto p-3 space-y-4">
                <div class="text-center text-gray-500 text-sm mt-10">No jobs run yet.</div>
            </div>
        </aside>

    </div>

    <!-- Scripts -->
    <script>
        // State Management
        const state = {
            variables: [
                { id: 'v1', key: 'system_prompt', value: 'You are a helpful, concise AI assistant.' },
                { id: 'v2', key: 'temperature', value: '0.7' }
            ],
            jobs: [],
            models: []
        };

        // DOM Elements
        const DOM = {
            serverUrl: document.getElementById('serverUrl'),
            connectBtn: document.getElementById('connectBtn'),
            modelSelector: document.getElementById('modelSelector'),
            variablesContainer: document.getElementById('variablesContainer'),
            addVarBtn: document.getElementById('addVarBtn'),
            promptInput: document.getElementById('promptInput'),
            runJobBtn: document.getElementById('runJobBtn'),
            jobsContainer: document.getElementById('jobsContainer'),
            jobCount: document.getElementById('jobCount'),
            notificationBanner: document.getElementById('notificationBanner'),
            notificationMessage: document.getElementById('notificationMessage')
        };

        // Utilities
        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        function showError(title, message) {
            DOM.notificationMessage.innerHTML = `<strong class="font-bold">${title}:</strong> <span class="block sm:inline">${message}</span>`;
            DOM.notificationBanner.classList.remove('hidden');
        }

        function hideError() {
            DOM.notificationBanner.classList.add('hidden');
        }

        // Variable Management
        function renderVariables() {
            DOM.variablesContainer.innerHTML = '';
            
            if (state.variables.length === 0) {
                DOM.variablesContainer.innerHTML = `<div class="text-gray-500 text-sm text-center py-2">No structural variables.</div>`;
                return;
            }

            state.variables.forEach((variable, index) => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-2';
                row.innerHTML = `
                    <input type="text" value="${variable.key}" data-id="${variable.id}" data-type="key" class="var-input w-1/3 bg-gray-900 border border-gray-600 rounded p-1.5 text-sm focus:outline-none focus:border-blue-500" placeholder="Key">
                    <span class="text-gray-500">=</span>
                    <input type="text" value="${variable.value}" data-id="${variable.id}" data-type="value" class="var-input flex-1 bg-gray-900 border border-gray-600 rounded p-1.5 text-sm focus:outline-none focus:border-blue-500" placeholder="Value">
                    <button data-id="${variable.id}" class="delete-var-btn text-gray-500 hover:text-red-400 p-1 transition-colors" title="Delete">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                `;
                DOM.variablesContainer.appendChild(row);
            });

            // Bind events for variables
            document.querySelectorAll('.var-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const id = e.target.getAttribute('data-id');
                    const type = e.target.getAttribute('data-type');
                    const variable = state.variables.find(v => v.id === id);
                    if (variable) variable[type] = e.target.value;
                });
            });

            document.querySelectorAll('.delete-var-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    state.variables = state.variables.filter(v => v.id !== id);
                    renderVariables();
                });
            });
        }

        DOM.addVarBtn.addEventListener('click', () => {
            state.variables.push({ id: generateId(), key: `var_${state.variables.length + 1}`, value: '' });
            renderVariables();
        });

        // API Interactions
        async function fetchModels() {
            hideError();
            DOM.connectBtn.disabled = true;
            DOM.connectBtn.innerText = 'Connecting...';
            
            try {
                const url = DOM.serverUrl.value.replace(/\/$/, '') + '/api/tags';
                const response = await fetch(url);
                
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                state.models = data.models || [];
                
                DOM.modelSelector.innerHTML = '';
                if (state.models.length === 0) {
                    DOM.modelSelector.innerHTML = '<option value="">No models found</option>';
                    DOM.modelSelector.disabled = true;
                } else {
                    state.models.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.name;
                        opt.textContent = m.name;
                        DOM.modelSelector.appendChild(opt);
                    });
                    DOM.modelSelector.disabled = false;
                    DOM.runJobBtn.disabled = false;
                }
                
                DOM.connectBtn.classList.replace('bg-emerald-600', 'bg-blue-600');
                DOM.connectBtn.innerText = 'Connected';
                setTimeout(() => {
                    DOM.connectBtn.classList.replace('bg-blue-600', 'bg-emerald-600');
                    DOM.connectBtn.innerText = 'Refresh Models';
                }, 2000);

            } catch (error) {
                console.error('Fetch Models Error:', error);
                showError('Connection Failed', `Could not connect to Ollama. <br><br><strong>Fix for CORS:</strong> If running locally, you must start Ollama with CORS enabled.<br>Run this in your terminal before starting Ollama: <br><code class="bg-gray-800 px-1 py-0.5 rounded text-white font-mono block mt-2 mb-1">OLLAMA_ORIGINS="*" ollama serve</code>`);
                DOM.modelSelector.innerHTML = '<option value="">Connection Failed</option>';
                DOM.modelSelector.disabled = true;
                DOM.runJobBtn.disabled = true;
                DOM.connectBtn.innerText = 'Connect & Fetch';
            } finally {
                DOM.connectBtn.disabled = false;
            }
        }

        DOM.connectBtn.addEventListener('click', fetchModels);

        // Job Management
        function renderJobs() {
            DOM.jobCount.innerText = state.jobs.length;
            if (state.jobs.length === 0) {
                DOM.jobsContainer.innerHTML = `<div class="text-center text-gray-500 text-sm mt-10">No jobs run yet.</div>`;
                return;
            }

            DOM.jobsContainer.innerHTML = '';
            // Render in reverse chronological order
            [...state.jobs].reverse().forEach(job => {
                const jobEl = document.createElement('div');
                jobEl.id = `job-${job.id}`;
                jobEl.className = 'bg-gray-700/30 border border-gray-600 rounded-md p-3 flex flex-col gap-2 transition-all';
                
                let statusColor = 'text-gray-400';
                let statusBg = 'bg-gray-600';
                if (job.status === 'Streaming') { statusColor = 'text-blue-400'; statusBg = 'bg-blue-900/50 border-blue-700'; }
                if (job.status === 'Completed') { statusColor = 'text-emerald-400'; statusBg = 'bg-emerald-900/20'; }
                if (job.status === 'Error') { statusColor = 'text-red-400'; statusBg = 'bg-red-900/20 border-red-800'; }

                jobEl.classList.add(...statusBg.split(' '));

                const streamingClass = job.status === 'Streaming' ? 'streaming-cursor' : '';

                jobEl.innerHTML = `
                    <div class="flex justify-between items-center text-xs">
                        <span class="font-mono text-gray-300 bg-gray-900 px-2 py-0.5 rounded">${job.model}</span>
                        <span class="font-semibold tracking-wide ${statusColor}">${job.status.toUpperCase()}</span>
                    </div>
                    <div class="text-xs text-gray-400 bg-gray-800/50 p-2 rounded line-clamp-2 italic border border-gray-700/50" title="${escapeHtml(job.prompt)}">
                        ${escapeHtml(job.prompt)}
                    </div>
                    <div class="text-sm text-gray-200 mt-1 whitespace-pre-wrap font-sans break-words max-h-60 overflow-y-auto pr-1 ${streamingClass}">${escapeHtml(job.output)}</div>
                    ${job.error ? `<div class="text-xs text-red-400 mt-1 bg-red-900/30 p-2 rounded">${escapeHtml(job.error)}</div>` : ''}
                `;
                DOM.jobsContainer.appendChild(jobEl);
            });
        }

        // Escape HTML to prevent XSS in rendering
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function runJob() {
            const prompt = DOM.promptInput.value.trim();
            const model = DOM.modelSelector.value;
            const baseUrl = DOM.serverUrl.value.replace(/\/$/, '');

            if (!prompt) return;
            if (!model) {
                showError('Configuration', 'Please connect and select a model first.');
                return;
            }

            // Lock UI
            DOM.runJobBtn.disabled = true;
            DOM.runJobBtn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Running...`;
            hideError();

            // Prepare Payload based on Struct Variables
            let systemPrompt = '';
            let options = {};
            
            state.variables.forEach(v => {
                if (!v.key || !v.value) return;
                
                if (v.key === 'system_prompt') {
                    systemPrompt = v.value;
                } else if (v.key === 'temperature') {
                    options[v.key] = parseFloat(v.value);
                } else {
                    // Try to parse other numeric values for options, else string
                    const num = parseFloat(v.value);
                    options[v.key] = isNaN(num) ? v.value : num;
                }
            });

            const payload = {
                model: model,
                prompt: prompt,
                stream: true
            };
            
            if (systemPrompt) payload.system = systemPrompt;
            if (Object.keys(options).length > 0) payload.options = options;

            // Create Job State
            const job = {
                id: generateId(),
                model: model,
                prompt: prompt,
                output: '',
                status: 'Pending',
                error: null
            };
            state.jobs.push(job);
            renderJobs();

            try {
                job.status = 'Streaming';
                renderJobs();

                const response = await fetch(`${baseUrl}/api/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`Server returned ${response.status}`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n').filter(Boolean);

                    for (const line of lines) {
                        try {
                            const data = JSON.parse(line);
                            if (data.response) {
                                job.output += data.response;
                                // Debounce UI update slightly or just update directly if fast enough
                                renderJobs(); 
                            }
                        } catch (e) {
                            console.error("Error parsing JSON chunk", e, line);
                        }
                    }
                }

                job.status = 'Completed';
            } catch (error) {
                console.error("Job Error:", error);
                job.status = 'Error';
                job.error = error.message;
                
                if (error.message.includes('Failed to fetch')) {
                    job.error += " (CORS or Connection issue. Ensure OLLAMA_ORIGINS='*' is set.)";
                }
            } finally {
                renderJobs();
                DOM.runJobBtn.disabled = false;
                DOM.runJobBtn.innerHTML = `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg> Run Job`;
            }
        }

        DOM.runJobBtn.addEventListener('click', runJob);

        // Allow Ctrl+Enter to run
        DOM.promptInput.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                runJob();
            }
        });

        // Initialize App
        function init() {
            renderVariables();
            // Automatically attempt connection on load
            fetchModels();
        }

        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
