<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Ocean & ER9 Train Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        /* Make sure dat.gui is accessible on top */
        .dg.ac {
            z-index: 10 !important;
        }
        /* Bottom Toolbar */
        #toolbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(30, 30, 30, 0.95);
            padding: 12px 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            z-index: 20;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        .tool-btn {
            background: #444;
            border: 2px solid transparent;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .tool-btn:hover { background: #555; transform: translateY(-2px); }
        .tool-btn.active { border-color: #4ade80; background: #2f4f2f; box-shadow: 0 0 15px rgba(74, 222, 128, 0.2); }
    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div id="ui-layer" class="text-white hidden">
        <h1 class="text-4xl font-bold mb-2">Coastal Sandbox</h1>
        <p class="text-lg opacity-80 max-w-md">
            Use the editor panel on the right to tweak ocean tides, wave physics, time of day, and the ER9 train speed. 
            Drag the screen to rotate the camera. Scroll to zoom.
        </p>
    </div>

    <!-- WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Bottom Editor Toolbar -->
    <div id="toolbar">
        <button class="tool-btn active" data-tool="track">🛤️ Build Track</button>
        <button class="tool-btn" data-tool="train">🚂 Spawn Train</button>
        <button class="tool-btn" data-tool="delete">❌ Eraser</button>
    </div>

    <!-- Three.js and Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>

    <script>
        // Sandbox Configuration Parameters
        const params = {
            timeOfDay: 14, // 14:00 (2 PM)
            tideLevel: 0,
            waveHeight: 1.5,
            waveSpeed: 1.0,
            waveFrequency: 0.05,
            waterColor: '#005b8a',
            foamIntensity: 1.5,
            trainSpeed: 15.0
        };

        // Global Variables
        let scene, camera, renderer, controls, clock;
        let water, waterMaterial, sunLight, trainGroup;
        let raycaster, mouse;
        let activeTool = 'track';
        let placedObjects = [];
        let gridHelper;

        const waterUniforms = {
            uTime: { value: 0 },
            uWaveHeight: { value: params.waveHeight },
            uWaveSpeed: { value: params.waveSpeed },
            uWaveFrequency: { value: params.waveFrequency },
            uFoamIntensity: { value: params.foamIntensity }
        };

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.002);
            clock = new THREE.Clock();

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.set(-50, 30, 80);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            container.appendChild(renderer.domElement);

            // 4. Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.02; // Prevent going below ground
            controls.minDistance = 10;
            controls.maxDistance = 500;
            controls.target.set(0, 5, 0);

            // 5. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            sunLight = new THREE.DirectionalLight(0xffffff, 2.0);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 1000;
            const d = 150;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // 6. Build Environment
            createMountains();
            createBeach();
            createOcean();

            // Interaction & Editor Setup
            trainGroup = new THREE.Group();
            scene.add(trainGroup);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            
            gridHelper = new THREE.GridHelper(1000, 100, 0xffffff, 0xffffff);
            gridHelper.material.opacity = 0.15;
            gridHelper.material.transparent = true;
            gridHelper.position.y = 0.2;
            scene.add(gridHelper);

            setupInteraction();
            setupToolbar();

            // Pre-place a demo line
            for(let z = -50; z <= 50; z += 10) {
                placeTrackSegment(20, z);
            }
            placeTrainInstance(20, 0);

            // 7. Setup Editor (dat.gui)
            setupGUI();

            // Initial environment update
            updateEnvironment();

            // Window resize handler
            window.addEventListener('resize', onWindowResize, false);
        }

        function createBeach() {
            // Beach Geometry (sloped)
            const beachGeo = new THREE.PlaneGeometry(1000, 1000, 64, 64);
            beachGeo.rotateX(-Math.PI / 2);
            
            // Slope the beach down into the water on the left (negative X)
            const pos = beachGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                
                let y = 0;
                if (x < 0) {
                    y = x * 0.08; // slope down
                    if (y < -20) y = -20;
                }
                
                pos.setY(i, y);
            }
            beachGeo.computeVertexNormals();

            const beachMat = new THREE.MeshStandardMaterial({
                color: 0xcdb283, // Sand color
                roughness: 0.9,
                metalness: 0.05
            });

            const beach = new THREE.Mesh(beachGeo, beachMat);
            beach.receiveShadow = true;
            scene.add(beach);
        }

        function createMountains() {
            const mtnGeo = new THREE.PlaneGeometry(1000, 300, 64, 32);
            mtnGeo.rotateX(-Math.PI / 2);
            const pos = mtnGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const z = pos.getZ(i);
                const noise = Math.sin(x*0.02) * Math.cos(z*0.03) * 40 + Math.sin(x*0.08)*15;
                pos.setY(i, Math.max(0, noise));
            }
            mtnGeo.computeVertexNormals();
            const mtnMat = new THREE.MeshStandardMaterial({ color: 0x4a5d23, roughness: 0.9 });
            const mountains = new THREE.Mesh(mtnGeo, mtnMat);
            mountains.position.set(0, -10, -450); 
            scene.add(mountains);
        }

        function createOcean() {
            const waterGeo = new THREE.PlaneGeometry(1000, 1000, 256, 256);
            waterGeo.rotateX(-Math.PI / 2);

            waterMaterial = new THREE.MeshPhysicalMaterial({
                color: params.waterColor,
                metalness: 0.8,
                roughness: 0.1,
                transmission: 0.5,
                transparent: true,
                opacity: 0.9,
            });

            // Inject custom shader for realistic Gerstner-like waves and foam
            waterMaterial.onBeforeCompile = (shader) => {
                shader.uniforms.uTime = waterUniforms.uTime;
                shader.uniforms.uWaveHeight = waterUniforms.uWaveHeight;
                shader.uniforms.uWaveSpeed = waterUniforms.uWaveSpeed;
                shader.uniforms.uWaveFrequency = waterUniforms.uWaveFrequency;
                shader.uniforms.uFoamIntensity = waterUniforms.uFoamIntensity;

                shader.vertexShader = `
                    uniform float uTime;
                    uniform float uWaveHeight;
                    uniform float uWaveSpeed;
                    uniform float uWaveFrequency;
                    varying float vWaveHeight;
                    varying vec3 vWorldPos;
                    ${shader.vertexShader}
                `;

                shader.vertexShader = shader.vertexShader.replace(
                    '#include <begin_vertex>',
                    `
                    #include <begin_vertex>
                    
                    float t = uTime * uWaveSpeed;
                    
                    // Complex overlapping sine waves for water displacement
                    float w1 = sin(position.x * uWaveFrequency + t) * cos(position.y * uWaveFrequency + t);
                    float w2 = sin(position.x * uWaveFrequency * 1.5 - t * 1.2) * 0.5;
                    float w3 = cos(position.y * uWaveFrequency * 2.0 + t * 0.8) * 0.25;
                    float w4 = sin((position.x + position.y) * uWaveFrequency * 0.5 + t * 0.5) * 1.2;
                    
                    float h = (w1 + w2 + w3 + w4) * uWaveHeight;
                    transformed.y += h; // local Z becomes world Y after PlaneGeometry rotateX
                    vWaveHeight = h;
                    
                    vec4 worldPositionVec = modelMatrix * vec4(transformed, 1.0);
                    vWorldPos = worldPositionVec.xyz;
                    `
                );

                shader.fragmentShader = `
                    uniform float uFoamIntensity;
                    varying float vWaveHeight;
                    varying vec3 vWorldPos;
                    ${shader.fragmentShader}
                `;

                shader.fragmentShader = shader.fragmentShader.replace(
                    '#include <dithering_fragment>',
                    `
                    #include <dithering_fragment>
                    
                    // Generate foam based on wave peaks and shore intersection
                    // We assume beach slopes up. Z < 10 is near shore.
                    float shoreFoam = smoothstep(5.0, -10.0, vWorldPos.x) * 0.8;
                    float waveFoam = smoothstep(0.5, 3.0, vWaveHeight) * uFoamIntensity;
                    
                    float totalFoam = clamp(shoreFoam + waveFoam, 0.0, 1.0);
                    
                    // Blend foam color (white) with water base color
                    gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(1.0, 1.0, 1.0), totalFoam);
                    gl_FragColor.a = mix(gl_FragColor.a, 1.0, totalFoam * 0.5);
                    `
                );
            };

            water = new THREE.Mesh(waterGeo, waterMaterial);
            water.position.set(-250, -2, 0); // Shifted towards the left (ocean side)
            scene.add(water);
        }

        function placeTrackSegment(x, z) {
            const trackGroup = new THREE.Group();
            
            // Sleepers (Wooden planks)
            const sleeperGeo = new THREE.BoxGeometry(4, 0.2, 0.6);
            const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x4a3b2c, roughness: 1.0 });
            
            for(let i = -4; i <= 4; i += 2) {
                const sleeper = new THREE.Mesh(sleeperGeo, sleeperMat);
                sleeper.position.set(0, 0.1, i);
                sleeper.castShadow = true;
                sleeper.receiveShadow = true;
                trackGroup.add(sleeper);
            }

            // Rails (Steel tracks)
            const railGeo = new THREE.BoxGeometry(0.2, 0.2, 10);
            const railMat = new THREE.MeshStandardMaterial({ color: 0x777777, metalness: 0.8, roughness: 0.3 });
            
            const rail1 = new THREE.Mesh(railGeo, railMat);
            rail1.position.set(1.5, 0.3, 0);
            rail1.castShadow = true;
            
            const rail2 = new THREE.Mesh(railGeo, railMat);
            rail2.position.set(-1.5, 0.3, 0);
            rail2.castShadow = true;
            
            trackGroup.add(rail1);
            trackGroup.add(rail2);

            trackGroup.position.set(x, 0, z);
            trackGroup.userData = { type: 'track' };
            scene.add(trackGroup);
            placedObjects.push(trackGroup);
        }

        function placeTrainInstance(x, z) {
            const tGroup = new THREE.Group();
            
            // Materials
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1c4a2d, roughness: 0.4 }); // ER9 Green
            const stripeMat = new THREE.MeshStandardMaterial({ color: 0xe5c158, roughness: 0.4 }); // Yellow stripe
            const windowMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.7 });

            // Main Body
            const bodyGeo = new THREE.BoxGeometry(3.5, 3.5, 16);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 2.5;
            body.castShadow = true;
            tGroup.add(body);

            // Roof
            const roofGeo = new THREE.CylinderGeometry(1.7, 1.7, 16, 12, 1, false, 0, Math.PI);
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.rotation.z = Math.PI / 2;
            roof.rotation.y = Math.PI / 2;
            roof.position.y = 4.25;
            roof.castShadow = true;
            tGroup.add(roof);

            // Stripe
            const stripeGeo = new THREE.BoxGeometry(3.6, 0.3, 16.1);
            const stripe = new THREE.Mesh(stripeGeo, stripeMat);
            stripe.position.y = 1.5;
            tGroup.add(stripe);

            // Windows
            const winGeo = new THREE.BoxGeometry(3.7, 1.2, 14);
            const windows = new THREE.Mesh(winGeo, windowMat);
            windows.position.y = 2.8;
            tGroup.add(windows);

            tGroup.position.set(x, 0.5, z);
            tGroup.userData = { type: 'train' };
            trainGroup.add(tGroup);
            placedObjects.push(tGroup);
        }

        function setupToolbar() {
            const buttons = document.querySelectorAll('.tool-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    buttons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeTool = btn.dataset.tool;
                });
            });
        }

        function setupInteraction() {
            const planeGeo = new THREE.PlaneGeometry(1000, 1000);
            planeGeo.rotateX(-Math.PI / 2);
            const invisiblePlane = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({ visible: false }));
            scene.add(invisiblePlane);

            window.addEventListener('pointerdown', (e) => {
                // Ignore clicks on UI
                if (e.target.closest('#toolbar') || e.target.closest('.dg.ac')) return;

                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);

                if (activeTool === 'delete') {
                    const intersects = raycaster.intersectObjects(placedObjects, true);
                    if (intersects.length > 0) {
                        let obj = intersects[0].object;
                        // Ascend to the root group placed
                        while(obj.parent && obj.parent.type === 'Group' && obj.parent !== scene && obj.parent !== trainGroup) {
                            obj = obj.parent;
                        }
                        if (obj.parent === trainGroup) trainGroup.remove(obj);
                        else scene.remove(obj);
                        placedObjects = placedObjects.filter(o => o !== obj);
                    }
                } else {
                    const intersects = raycaster.intersectObject(invisiblePlane);
                    if (intersects.length > 0) {
                        const point = intersects[0].point;
                        // Snap to 10x10 grid
                        const snapX = Math.round(point.x / 10) * 10;
                        const snapZ = Math.round(point.z / 10) * 10;
                        
                        // Prevent placing on steep underwater slope
                        if (snapX < -20) return; 

                        if (activeTool === 'track') {
                            placeTrackSegment(snapX, snapZ);
                        } else if (activeTool === 'train') {
                            placeTrainInstance(snapX, snapZ);
                        }
                    }
                }
            });
        }

        function setupGUI() {
            const gui = new dat.GUI({ width: 300 });

            // Environment Folder
            const envFolder = gui.addFolder('Environment');
            envFolder.add(params, 'timeOfDay', 0, 24, 0.1).name('Time of Day').onChange(updateEnvironment);
            envFolder.open();

            // Ocean Folder
            const oceanFolder = gui.addFolder('Ocean Physics');
            oceanFolder.add(params, 'tideLevel', -10, 10, 0.1).name('Tide Level').onChange(v => water.position.y = v);
            oceanFolder.add(params, 'waveHeight', 0.0, 5.0, 0.1).name('Wave Height').onChange(v => waterUniforms.uWaveHeight.value = v);
            oceanFolder.add(params, 'waveSpeed', 0.0, 3.0, 0.1).name('Wave Speed').onChange(v => waterUniforms.uWaveSpeed.value = v);
            oceanFolder.add(params, 'waveFrequency', 0.01, 0.2, 0.01).name('Wave Freq').onChange(v => waterUniforms.uWaveFrequency.value = v);
            oceanFolder.add(params, 'foamIntensity', 0.0, 3.0, 0.1).name('Shore Foam').onChange(v => waterUniforms.uFoamIntensity.value = v);
            oceanFolder.addColor(params, 'waterColor').name('Water Color').onChange(v => waterMaterial.color.set(v));
            oceanFolder.open();

            // Train Folder
            const trainFolder = gui.addFolder('ER9 Train');
            trainFolder.add(params, 'trainSpeed', 0, 50, 1).name('Train Speed');
            trainFolder.open();
        }

        function updateEnvironment() {
            // Calculate sun position based on time of day (6 = sunrise, 18 = sunset)
            const hourAngle = ((params.timeOfDay - 6) / 12) * Math.PI;
            
            const radius = 500;
            sunLight.position.x = Math.cos(hourAngle) * radius;
            sunLight.position.y = Math.sin(hourAngle) * radius;
            sunLight.position.z = -100;

            // Day/Night Cycle coloring
            if (sunLight.position.y > 0) {
                // Day
                const intensity = Math.min(sunLight.position.y / 100, 1);
                sunLight.intensity = intensity * 2.0;
                
                // Color lerping for sunrise/sunset
                const t = Math.max(0, Math.min(1, sunLight.position.y / 150));
                
                sunLight.color.lerpColors(new THREE.Color(0xffaa55), new THREE.Color(0xffffff), t);
                scene.background.lerpColors(new THREE.Color(0xff8844), new THREE.Color(0x87CEEB), t);
                scene.fog.color.copy(scene.background);
            } else {
                // Night
                sunLight.intensity = 0;
                scene.background.setHex(0x050510);
                scene.fog.color.setHex(0x050510);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            // Update Ocean Shader
            waterUniforms.uTime.value = elapsedTime;

            // Move Trains
            if (trainGroup && trainGroup.children.length > 0) {
                trainGroup.children.forEach(train => {
                    train.position.z -= params.trainSpeed * delta;
                    if (train.position.z < -400) {
                        train.position.z = 400;
                    }
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
