<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Street Dialogue — WebGL + Web Speech TTS</title>
  <!-- Tailwind CSS for responsive glassmorphic HUD & controls -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Inter for clean comic/cinematic UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Three.js & OrbitControls via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      overflow: hidden;
      background-color: #070912;
      color: #f8fafc;
      user-select: none;
    }
    #webgl-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Custom subtle range slider */
    input[type="range"] {
      accent-color: #f59e0b;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: translateY(10px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .subtitle-pop {
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Reactive On-Screen Key & Action Button Highlight / Scale / Fade Pulse */
    .key-btn {
      transition: transform 0.12s cubic-bezier(0.22, 1, 0.36, 1),
                  background-color 0.16s ease,
                  border-color 0.16s ease,
                  box-shadow 0.22s ease,
                  opacity 0.18s ease;
      opacity: 0.88;
    }
    .key-btn.is-active,
    .key-btn:active {
      transform: scale(1.13);
      opacity: 1;
      background-color: rgba(16, 185, 129, 0.92) !important;
      color: #020617 !important;
      border-color: #a7f3d0 !important;
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.75), inset 0 0 8px rgba(255, 255, 255, 0.5);
    }
    .key-btn.combat-btn.is-active,
    .key-btn.combat-btn:active {
      background-color: rgba(245, 158, 11, 0.95) !important;
      border-color: #fde68a !important;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.85), inset 0 0 8px rgba(255, 255, 255, 0.55);
    }

    /* Circular Slanted Neon-Glitch Minimap Frame */
    @keyframes neonGlitchJitter {
      0%, 88%, 100% {
        transform: translate(0, 0) skewX(0deg);
        box-shadow:
          0 0 18px rgba(34, 211, 238, 0.55),
          0 0 34px rgba(232, 121, 249, 0.35),
          inset 0 0 18px rgba(34, 211, 238, 0.45);
      }
      90% {
        transform: translate(-2px, 1px) skewX(-3deg);
        box-shadow:
          -4px 0 16px rgba(232, 121, 249, 0.85),
          4px 0 16px rgba(34, 211, 238, 0.85),
          inset 0 0 22px rgba(232, 121, 249, 0.6);
      }
      92% {
        transform: translate(2px, -1px) skewX(2deg);
        box-shadow:
          3px 0 18px rgba(34, 211, 238, 0.9),
          -3px 0 18px rgba(244, 63, 94, 0.85);
      }
      94% {
        transform: translate(-1px, 0) skewX(0deg);
      }
    }
    @keyframes scanlineScroll {
      0% { background-position: 0 0; }
      100% { background-position: 0 36px; }
    }
    .minimap-circle-frame {
      border-radius: 9999px;
      animation: neonGlitchJitter 3.4s infinite;
      border: 2.5px solid rgba(34, 211, 238, 0.85);
    }
    .minimap-glitch-overlay {
      border-radius: 9999px;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(34, 211, 238, 0.11) 0px,
          rgba(34, 211, 238, 0.11) 1px,
          transparent 1px,
          transparent 4px
        ),
        radial-gradient(circle at center, transparent 58%, rgba(232, 121, 249, 0.28) 92%, rgba(34, 211, 238, 0.48) 100%);
      animation: scanlineScroll 1.2s linear infinite;
      mix-blend-mode: screen;
    }
  </style>
</head>
<body class="antialiased">
  <!-- Full-viewport 3D WebGL Canvas Container -->
  <div id="webgl-container"></div>

  <!-- Top-Right Circular Slanted Neon-Glitch Radar Camera HUD Frame -->
  <div id="minimap-hud" class="fixed top-16 sm:top-20 right-3 sm:right-5 z-10 pointer-events-none flex flex-col items-center">
    <div id="minimap-frame" class="minimap-circle-frame relative w-28 h-28 sm:w-36 sm:h-36 overflow-hidden bg-slate-950/30">
      <div class="minimap-glitch-overlay absolute inset-0 pointer-events-none"></div>
      <!-- Crosshair & Compass Blip -->
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-45">
        <div class="w-full h-[1px] bg-cyan-400/50"></div>
      </div>
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-45">
        <div class="h-full w-[1px] bg-cyan-400/50"></div>
      </div>
      <span class="absolute top-1.5 left-1/2 -translate-x-1/2 text-[8px] font-black tracking-widest text-cyan-300 drop-shadow">
        N • RADAR
      </span>
    </div>
    <span class="mt-1 px-2 py-0.5 rounded-full bg-slate-950/85 border border-cyan-500/40 text-[9px] font-bold tracking-wider uppercase text-cyan-300 shadow">
      Slanted Top-Down
    </span>
  </div>

  <!-- Top-Left First-Person Viewmodel Framebuffer PIP Window (Below Header) -->
  <div id="fpv-hud" class="fixed top-20 sm:top-24 left-3 sm:left-5 z-10 pointer-events-none flex flex-col items-start">
    <div id="fpv-frame" class="relative w-36 h-24 sm:w-48 sm:h-32 rounded-2xl overflow-hidden border-2 border-emerald-400/80 shadow-[0_0_20px_rgba(16,185,129,0.35)] bg-slate-950/20">
      <!-- Subtle Corner Reticle -->
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <div class="w-2.5 h-2.5 rounded-full border border-emerald-300/70"></div>
      </div>
      <div class="absolute top-1.5 left-2 right-2 flex items-center justify-between text-[9px] font-extrabold uppercase tracking-wider text-emerald-300 drop-shadow">
        <span>FPV • Viewmodel</span>
        <span class="px-1.5 py-0.2 rounded bg-slate-950/80 border border-emerald-500/40 text-[8px]">CAM 2</span>
      </div>
    </div>
  </div>

  <!-- Top Header & Status Bar -->
  <header class="fixed top-0 left-0 right-0 z-10 pointer-events-none p-3 sm:p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
    <div class="pointer-events-auto bg-slate-950/85 backdrop-blur-md border border-slate-800/80 rounded-2xl px-4 py-2 shadow-xl">
      <div class="flex items-center gap-2.5">
        <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
        <h1 class="text-sm sm:text-base font-bold tracking-tight text-white">
          Midnight Corner <span class="text-amber-400 font-semibold">• WebGL + TTS</span>
        </h1>
        <span id="player-anim-badge" class="ml-1 px-2 py-0.5 rounded-md text-[10px] font-extrabold uppercase tracking-wider bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">
          IDLE
        </span>
      </div>
      <p class="text-[11px] text-slate-400 mt-0.5">
        <span class="text-emerald-300 font-semibold">WASD</span> Move • <span class="text-emerald-300 font-semibold">Shift</span> Run • <span class="text-emerald-300 font-semibold">Space/J</span> Jump • <span class="text-amber-300 font-semibold">F</span> Punch • <span class="text-amber-300 font-semibold">K</span> Kick
      </p>
    </div>

    <!-- Speaker Legend, Camera Follow Toggle & TTS Engine Pill -->
    <div class="pointer-events-auto flex flex-wrap items-center gap-2 bg-slate-950/85 backdrop-blur-md border border-slate-800/80 rounded-2xl px-3.5 py-2 shadow-xl text-xs">
      <span class="inline-flex items-center gap-1.5 font-semibold text-amber-400">
        <span class="w-2 h-2 rounded-full bg-amber-400"></span> Thug
      </span>
      <span class="text-slate-600">|</span>
      <span class="inline-flex items-center gap-1.5 font-semibold text-sky-400">
        <span class="w-2 h-2 rounded-full bg-sky-400"></span> Civilian
      </span>
      <span class="text-slate-600">|</span>
      <span class="inline-flex items-center gap-1.5 font-semibold text-emerald-400">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Citizen
      </span>
      <span class="text-slate-600">|</span>
      <button id="btn-cam-follow" class="px-2 py-0.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold transition cursor-pointer" title="Toggle Camera Follow on Citizen">
        Cam: Free
      </button>
      <span class="text-slate-600">|</span>
      <span id="tts-badge" class="text-slate-300 font-medium">Web Speech Ready</span>
    </div>
  </header>

  <!-- Reactive On-Screen W A S D Directional Pad (Bottom-Left above Dock) -->
  <div id="mobile-dpad" class="fixed bottom-56 sm:bottom-52 left-3 sm:left-5 z-10 pointer-events-auto select-none">
    <div class="bg-slate-950/80 backdrop-blur-md border border-slate-800/90 rounded-2xl p-2 shadow-xl grid grid-cols-3 gap-1.5 w-32 h-32">
      <div></div>
      <button id="btn-key-up" data-dir="up" class="key-btn rounded-xl bg-slate-800/95 hover:bg-slate-700 text-slate-100 font-extrabold text-xs flex flex-col items-center justify-center border border-slate-700 cursor-pointer" aria-label="Walk Up (W)">
        <span class="text-[11px] leading-none">▲</span>
        <span class="text-[10px] text-emerald-300 mt-0.5">W</span>
      </button>
      <div></div>
      <button id="btn-key-left" data-dir="left" class="key-btn rounded-xl bg-slate-800/95 hover:bg-slate-700 text-slate-100 font-extrabold text-xs flex flex-col items-center justify-center border border-slate-700 cursor-pointer" aria-label="Walk Left (A)">
        <span class="text-[11px] leading-none">◀</span>
        <span class="text-[10px] text-emerald-300 mt-0.5">A</span>
      </button>
      <div class="rounded-xl bg-slate-900/90 border border-slate-800 flex items-center justify-center text-[9px] font-black tracking-wider text-emerald-400">
        MOVE
      </div>
      <button id="btn-key-right" data-dir="right" class="key-btn rounded-xl bg-slate-800/95 hover:bg-slate-700 text-slate-100 font-extrabold text-xs flex flex-col items-center justify-center border border-slate-700 cursor-pointer" aria-label="Walk Right (D)">
        <span class="text-[11px] leading-none">▶</span>
        <span class="text-[10px] text-emerald-300 mt-0.5">D</span>
      </button>
      <div></div>
      <button id="btn-key-down" data-dir="down" class="key-btn rounded-xl bg-slate-800/95 hover:bg-slate-700 text-slate-100 font-extrabold text-xs flex flex-col items-center justify-center border border-slate-700 cursor-pointer" aria-label="Walk Down (S)">
        <span class="text-[11px] leading-none">▼</span>
        <span class="text-[10px] text-emerald-300 mt-0.5">S</span>
      </button>
      <div></div>
    </div>
  </div>

  <!-- Reactive On-Screen Combat & Locomotion Action Buttons (Bottom-Right above Dock) -->
  <div id="combat-pad" class="fixed bottom-56 sm:bottom-52 right-3 sm:right-5 z-10 pointer-events-auto select-none">
    <div class="bg-slate-950/80 backdrop-blur-md border border-slate-800/90 rounded-2xl p-2 shadow-xl grid grid-cols-2 gap-1.5 w-36 sm:w-40">
      <button id="btn-act-run" class="key-btn rounded-xl bg-slate-800/95 hover:bg-slate-700 text-slate-100 font-extrabold text-[11px] py-2 px-2 flex flex-col items-center justify-center border border-slate-700 cursor-pointer">
        <span>RUN</span>
        <span class="text-[9px] text-emerald-300 font-mono">SHIFT</span>
      </button>
      <button id="btn-act-jump" class="key-btn rounded-xl bg-slate-800/95 hover:bg-slate-700 text-slate-100 font-extrabold text-[11px] py-2 px-2 flex flex-col items-center justify-center border border-slate-700 cursor-pointer">
        <span>JUMP</span>
        <span class="text-[9px] text-emerald-300 font-mono">SPACE / J</span>
      </button>
      <button id="btn-act-punch" class="key-btn combat-btn rounded-xl bg-slate-800/95 hover:bg-slate-700 text-amber-200 font-extrabold text-[11px] py-2 px-2 flex flex-col items-center justify-center border border-amber-500/40 cursor-pointer">
        <span>PUNCH</span>
        <span class="text-[9px] text-amber-400 font-mono">F / Z</span>
      </button>
      <button id="btn-act-kick" class="key-btn combat-btn rounded-xl bg-slate-800/95 hover:bg-slate-700 text-amber-200 font-extrabold text-[11px] py-2 px-2 flex flex-col items-center justify-center border border-amber-500/40 cursor-pointer">
        <span>KICK</span>
        <span class="text-[9px] text-amber-400 font-mono">K / X</span>
      </button>
    </div>
  </div>

  <!-- Center-Bottom Comic/Cinematic Subtitle Overlay -->
  <div id="subtitle-wrapper" class="fixed bottom-56 sm:bottom-52 left-0 right-0 z-10 pointer-events-none px-4 flex justify-center">
    <div id="subtitle-box" class="hidden max-w-lg w-full bg-slate-950/92 backdrop-blur-lg border-2 border-amber-400/80 rounded-2xl px-4 py-2.5 shadow-2xl subtitle-pop">
      <div class="flex items-center justify-between mb-1">
        <span id="subtitle-speaker" class="text-xs font-extrabold uppercase tracking-wider text-amber-400">
          THUG
        </span>
        <span id="subtitle-step" class="text-[11px] font-semibold text-slate-400">
          Line 1 / 5
        </span>
      </div>
      <p id="subtitle-text" class="text-xs sm:text-sm font-bold text-white leading-snug">
        “Hi.”
      </p>
    </div>
  </div>

  <!-- Bottom Interactive Playback & Voice Controls Dock -->
  <footer class="fixed bottom-0 left-0 right-0 z-10 p-2.5 sm:p-3.5 pointer-events-none flex justify-center">
    <div class="pointer-events-auto w-full max-w-5xl bg-slate-950/88 backdrop-blur-xl border border-slate-800/90 rounded-2xl p-2.5 sm:p-3 shadow-2xl flex flex-col gap-2">
      
      <!-- Row 1: Primary Transport Buttons, Dedicated Citizen Speak Buttons & Voice Controls -->
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
          <button id="btn-play" class="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 font-bold text-xs transition flex items-center gap-1.5 shadow-lg shadow-amber-500/20 cursor-pointer">
            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <span id="btn-play-label">Play Scene</span>
          </button>

          <!-- Dedicated Citizen Speech Button 1 -->
          <button id="btn-citizen-speak" class="px-3 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-slate-950 font-extrabold text-xs transition flex items-center gap-1.5 shadow-lg shadow-emerald-500/25 cursor-pointer">
            <span>🎙️ “Police Protect Me!”</span>
          </button>

          <!-- Dedicated Citizen Speech Button 2 -->
          <button id="btn-citizen-dev-speak" class="px-3 py-1.5 rounded-xl bg-teal-400 hover:bg-teal-300 active:scale-95 text-slate-950 font-extrabold text-xs transition flex items-center gap-1.5 shadow-lg shadow-teal-400/25 cursor-pointer">
            <span>🛠️ “Dual Contour IK Dev!”</span>
          </button>

          <button id="btn-stop" class="px-2.5 py-1.5 rounded-xl bg-rose-950/80 hover:bg-rose-900 active:scale-95 text-rose-200 font-semibold text-xs transition flex items-center gap-1 border border-rose-800/70 cursor-pointer">
            <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
            Stop
          </button>
        </div>

        <!-- Speed, Pitch Offset & Mute Toggle -->
        <div class="flex flex-wrap items-center gap-1.5 text-xs text-slate-300">
          <label class="flex items-center gap-1.5 bg-slate-900/90 px-2 py-1 rounded-xl border border-slate-800">
            <span class="text-slate-400 font-medium">Speed</span>
            <input id="ctrl-rate" type="range" min="0.7" max="1.4" step="0.05" value="1.0" class="w-12 sm:w-14 cursor-pointer" />
            <span id="val-rate" class="w-7 text-right font-mono text-amber-400">1.0x</span>
          </label>
          <label class="flex items-center gap-1.5 bg-slate-900/90 px-2 py-1 rounded-xl border border-slate-800">
            <span class="text-slate-400 font-medium">Pitch</span>
            <input id="ctrl-pitch" type="range" min="-0.3" max="0.3" step="0.05" value="0" class="w-12 sm:w-14 cursor-pointer" />
            <span id="val-pitch" class="w-8 text-right font-mono text-amber-400">+0.0</span>
          </label>
          <button id="btn-mute" title="Toggle Audio / Silent Timed Subtitle Mode" class="px-2.5 py-1 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 font-semibold transition cursor-pointer flex items-center gap-1">
            <span id="mute-icon">🔊</span>
            <span id="mute-label">TTS On</span>
          </button>
        </div>
      </div>

      <!-- Row 2: Individual Line Trigger Pills -->
      <div class="grid grid-cols-2 sm:grid-cols-5 gap-1.5">
        <button data-line="0" class="line-trigger text-left px-2.5 py-1.5 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/60 transition cursor-pointer group">
          <div class="flex items-center justify-between text-[10px] font-bold text-amber-400 mb-0.5">
            <span>1. THUG</span>
            <span class="opacity-60 group-hover:opacity-100">▶</span>
          </div>
          <div class="text-[11px] text-slate-200 truncate">“Hi.”</div>
        </button>

        <button data-line="1" class="line-trigger text-left px-2.5 py-1.5 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-800 hover:border-sky-500/60 transition cursor-pointer group">
          <div class="flex items-center justify-between text-[10px] font-bold text-sky-400 mb-0.5">
            <span>2. CIVILIAN</span>
            <span class="opacity-60 group-hover:opacity-100">▶</span>
          </div>
          <div class="text-[11px] text-slate-200 truncate">“You’re a crazy person.”</div>
        </button>

        <button data-line="2" class="line-trigger text-left px-2.5 py-1.5 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/60 transition cursor-pointer group">
          <div class="flex items-center justify-between text-[10px] font-bold text-amber-400 mb-0.5">
            <span>3. THUG</span>
            <span class="opacity-60 group-hover:opacity-100">▶</span>
          </div>
          <div class="text-[11px] text-slate-200 truncate">“I just want McDonald’s and bottle from u.”</div>
        </button>

        <button data-line="3" class="line-trigger text-left px-2.5 py-1.5 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-emerald-800/70 hover:border-emerald-400 transition cursor-pointer group">
          <div class="flex items-center justify-between text-[10px] font-bold text-emerald-400 mb-0.5">
            <span>4. CITIZEN</span>
            <span class="opacity-60 group-hover:opacity-100">▶</span>
          </div>
          <div class="text-[11px] text-slate-200 truncate">“You two are a thug and civilian, but I'ma citizen, the police PROTECT ME!!”</div>
        </button>

        <button data-line="4" class="line-trigger text-left px-2.5 py-1.5 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-teal-800/70 hover:border-teal-300 transition cursor-pointer group col-span-2 sm:col-span-1">
          <div class="flex items-center justify-between text-[10px] font-bold text-teal-300 mb-0.5">
            <span>5. CITIZEN DEV</span>
            <span class="opacity-60 group-hover:opacity-100">▶</span>
          </div>
          <div class="text-[11px] text-slate-200 truncate">“I'm coding some dual contour terrian thats modifiedable...”</div>
        </button>
      </div>
    </div>
  </footer>

  <script>
    /**
     * ============================================================================
     * 1. DIALOGUE SCRIPT & STATE CONFIGURATION
     * ============================================================================
     */
    const SCRIPT = [
      {
        id: 0,
        speaker: 'thug',
        displayName: 'Thug',
        text: 'Hi.',
        basePitch: 0.72,
        baseRate: 0.88,
        fallbackDurationMs: 1100
      },
      {
        id: 1,
        speaker: 'civilian',
        displayName: 'Civilian',
        text: 'You’re a crazy person.',
        basePitch: 1.24,
        baseRate: 1.12,
        fallbackDurationMs: 1900
      },
      {
        id: 2,
        speaker: 'thug',
        displayName: 'Thug',
        text: 'I just want McDonald’s and bottle from u.',
        basePitch: 0.74,
        baseRate: 0.92,
        fallbackDurationMs: 2800
      },
      {
        id: 3,
        speaker: 'citizen',
        displayName: 'Citizen (Player)',
        text: "You two are a thug and civilian, but I'ma citizen, the police PROTECT ME!!",
        basePitch: 1.08,
        baseRate: 1.05,
        fallbackDurationMs: 4200
      },
      {
        id: 4,
        speaker: 'citizen',
        displayName: 'Citizen (Player)',
        text: "I'm coding some dual contour terrian thats modifiedable in a physics ragdoll crafting player physics parts game where you gore fight with ik procedual fist punches that implease react",
        basePitch: 1.12,
        baseRate: 1.08,
        fallbackDurationMs: 7400
      }
    ];

    const state = {
      isPlaying: false,
      playSequence: false,
      currentLineIndex: -1,
      activeSpeaker: null, // 'thug' | 'civilian' | 'citizen' | null
      mouthPulse: 0,       // 0..1 audio-reactive jaw/head impulse
      isMuted: false,
      rateMultiplier: 1.0,
      pitchOffset: 0.0,
      thugVoice: null,
      civilianVoice: null,
      citizenVoice: null,
      ttsAvailable: 'speechSynthesis' in window,
      fallbackTimer: null,
      nextLineTimer: null,
      syllableInterval: null,
      speechToken: 0,      // Guards against stale callbacks when rapidly switching lines
      // Player-controlled Citizen movement, jump, run & combat state
      keys: { up: false, down: false, left: false, right: false },
      isRunning: false,
      playerSpeed: 0,
      walkPhase: 0,
      verticalY: 0,
      verticalVel: 0,
      isGrounded: true,
      landSquash: 0,
      punchTimer: 0,
      punchDuration: 0.34,
      punchSide: 1, // alternates 1 (right) and -1 (left)
      kickTimer: 0,
      kickDuration: 0.44,
      npcFlinch: { thug: 0, civilian: 0 },
      cameraFollow: false,
      lastAnimLabel: ''
    };

    /**
     * ============================================================================
     * 2. THREE.JS WEBGL SCENE + MULTI-CAMERA VIEWPORTS (MAIN + FPV + RADAR)
     * ============================================================================
     */
    let scene, camera, fpvCamera, minimapCamera, renderer, controls, clock;
    let thugRig, civilianRig, citizenRig, fpvViewmodel;
    let speakerSpotlight, speakerRing, floatingBubbleSprite, impactRingMesh;
    let minimapPlayerBlip, minimapThugBlip, minimapCivBlip;

    function initWebGLScene() {
      const container = document.getElementById('webgl-container');
      clock = new THREE.Clock();

      // Scene & Atmospheric Night Fog
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070a14);
      scene.fog = new THREE.FogExp2(0x070a14, 0.042);

      // 1) Main Perspective Camera
      camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        120
      );
      camera.position.set(0, 2.55, 7.6);

      // 2) First-Person Viewmodel Camera (Mini Framebuffer PIP Window)
      fpvCamera = new THREE.PerspectiveCamera(72, 1.5, 0.08, 80);
      scene.add(fpvCamera);

      // 3) Top-Right Circular Slanted Neon-Glitch Radar Camera
      minimapCamera = new THREE.PerspectiveCamera(42, 1.0, 0.5, 90);
      scene.add(minimapCamera);

      // Renderer with shadows, smooth tone mapping & scissor support
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      renderer.autoClear = false;
      container.appendChild(renderer.domElement);

      // OrbitControls for interactive main camera orbit & zoom
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.35, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.minDistance = 3.5;
      controls.maxDistance = 16;
      controls.maxPolarAngle = Math.PI * 0.49;
      controls.update();

      buildEnvironment();
      buildLighting();

      // Build stylized low-poly characters
      thugRig = createCharacter({
        role: 'thug',
        primaryColor: 0x1e293b,
        accentColor: 0xf59e0b,
        pantsColor: 0x0f172a,
        skinColor: 0xd99b78,
        headStyle: 'cap',
        scaleY: 1.04
      });
      thugRig.root.position.set(-1.35, 0, 0.15);
      thugRig.root.rotation.y = Math.PI * 0.44;
      scene.add(thugRig.root);

      civilianRig = createCharacter({
        role: 'civilian',
        primaryColor: 0x0284c7,
        accentColor: 0xe0f2fe,
        pantsColor: 0x334155,
        skinColor: 0xf1c29b,
        headStyle: 'hair',
        scaleY: 0.98
      });
      civilianRig.root.position.set(1.35, 0, -0.1);
      civilianRig.root.rotation.y = -Math.PI * 0.44;
      scene.add(civilianRig.root);

      // Build Player-Controlled Citizen Character in foreground-center
      citizenRig = createCharacter({
        role: 'citizen',
        primaryColor: 0x059669,
        accentColor: 0xfef08a,
        pantsColor: 0x1e293b,
        skinColor: 0xeab68c,
        headStyle: 'beanie',
        scaleY: 1.0
      });
      citizenRig.root.position.set(0, 0, 2.25);
      citizenRig.root.rotation.y = Math.PI;
      scene.add(citizenRig.root);

      // Build dedicated First-Person Viewmodel Arms/Fists attached to fpvCamera
      buildFirstPersonViewmodel();

      // Build glowing Radar Beacons above characters (visible in top-down radar)
      buildRadarBeacons();

      // Dynamic ground highlight ring, combat shockwave ring & floating 3D speech indicator
      createSpeechIndicators();

      window.addEventListener('resize', onWindowResize);
    }

    /**
     * Builds procedural First-Person Viewmodel emerald sleeves & fists attached
     * directly to fpvCamera so the mini framebuffer shows true FPS hands/kicks.
     */
    function buildFirstPersonViewmodel() {

      const skinMat = new THREE.MeshStandardMaterial({ color: 0xeab68c, roughness: 0.5, flatShading: true });
      const shoeMat = new THREE.MeshStandardMaterial({ color: 0xfef08a, roughness: 0.35, flatShading: true });
      const pantMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.75, flatShading: true });

      // Left First-Person Arm + Fist
      const leftGroup = new THREE.Group();
      leftGroup.position.set(-0.24, -0.22, -0.34);
      fpvViewmodel.add(leftGroup);

      const leftSleeve = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.09, 0.28), sleeveMat);
      leftSleeve.position.set(0, 0, 0.08);
      leftGroup.add(leftSleeve);

      const leftCuff = new THREE.Mesh(new THREE.BoxGeometry(0.095, 0.095, 0.03), cuffMat);
      leftCuff.position.set(0, 0, -0.06);
      leftGroup.add(leftCuff);

      const leftFist = new THREE.Mesh(new THREE.BoxGeometry(0.085, 0.085, 0.09), skinMat);
      leftFist.position.set(0, 0.01, -0.12);
      leftGroup.add(leftFist);

      // Right First-Person Arm + Fist
      const rightGroup = new THREE.Group();
      rightGroup.position.set(0.24, -0.22, -0.34);
      fpvViewmodel.add(rightGroup);

      const rightSleeve = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.09, 0.28), sleeveMat);
      rightSleeve.position.set(0, 0, 0.08);
      rightGroup.add(rightSleeve);

      const rightCuff = new THREE.Mesh(new THREE.BoxGeometry(0.095, 0.095, 0.03), cuffMat);
      rightCuff.position.set(0, 0, -0.06);
      rightGroup.add(rightCuff);

      const rightFist = new THREE.Mesh(new THREE.BoxGeometry(0.085, 0.085, 0.09), skinMat);
      rightFist.position.set(0, 0.01, -0.12);
      rightGroup.add(rightFist);

      // First-Person Kick Leg (swings up into lower-right view during Kick!)
      const fpvKickLeg = new THREE.Group();
      fpvKickLeg.position.set(0.1, -0.58, -0.22);
      fpvViewmodel.add(fpvKickLeg);

      shin.position.set(0, 0.17, 0);

      const boot = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.2), shoeMat);
      boot.position.set(0, 0.34, -0.04);

      fpvViewmodel.userData = { leftGroup, rightGroup, fpvKickLeg };
    }

    /**
     * Adds subtle glowing neon rings at the feet of characters for clear tracking
     * in the slanted top-down neon-glitch radar camera.
     */
    function buildRadarBeacons() {
      const makeBlip = (hex) => {
        const mesh = new THREE.Mesh(
          new THREE.RingGeometry(0.32, 0.46, 24),
          new THREE.MeshBasicMaterial({ color: hex, side: THREE.DoubleSide, transparent: true, opacity: 0.72 })
        );
        mesh.rotation.x = -Math.PI / 2;
        mesh.position.y = 0.172;
        scene.add(mesh);
        return mesh;
      };
      minimapPlayerBlip = makeBlip(0x22d3ee); // Cyan radar beacon for Player Citizen
      minimapThugBlip = makeBlip(0xf59e0b);   // Amber radar beacon for Thug
      minimapCivBlip = makeBlip(0xe879f9);    // Magenta radar beacon for Civilian
    }

    /**
     * Builds the urban sidewalk, asphalt street, curb, crosswalk stripes,
     * streetlight pole, and background building silhouettes with lit windows.
     */
    function buildEnvironment() {
      const roadGeo = new THREE.PlaneGeometry(50, 50);
      const roadMat = new THREE.MeshStandardMaterial({
        color: 0x111521,
        roughness: 0.85,
        metalness: 0.12
      });
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.rotation.x = -Math.PI / 2;
      road.receiveShadow = true;
      scene.add(road);

      const sidewalkGeo = new THREE.BoxGeometry(16, 0.16, 11);
      const sidewalkMat = new THREE.MeshStandardMaterial({
        color: 0x262d3d,
        roughness: 0.9,
        metalness: 0.05
      });
      const sidewalk = new THREE.Mesh(sidewalkGeo, sidewalkMat);
      sidewalk.position.set(0, 0.08, -1.6);
      sidewalk.receiveShadow = true;
      scene.add(sidewalk);

      const curbGeo = new THREE.BoxGeometry(16.05, 0.17, 0.25);
      const curbMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.8 });

      const stripeMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.7 });

        const stripe = new THREE.Mesh(new THREE.PlaneGeometry(0.65, 2.2), stripeMat);
        stripe.rotation.x = -Math.PI / 2;
        stripe.position.set(i * 1.4, 0.01, 5.4);
        stripe.receiveShadow = true;
        scene.add(stripe);
      }

      const lampGroup = new THREE.Group();
      lampGroup.position.set(0, 0.16, -2.5);

      const poleMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.7, roughness: 0.3 });
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.26, 0.5, 8), poleMat);
      base.position.y = 0.25;
      base.castShadow = true;
      lampGroup.add(base);

      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.09, 4.4, 8), poleMat);
      pole.position.y = 2.4;
      pole.castShadow = true;
      lampGroup.add(pole);

      const arm = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 1.35), poleMat);
      arm.position.set(0, 4.55, 0.55);
      lampGroup.add(arm);

      const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffedd5 });

      bulb.position.set(0, 4.42, 1.15);
      lampGroup.add(bulb);

      const hood = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.2, 8), poleMat);
      hood.position.set(0, 4.55, 1.15);
      lampGroup.add(hood);

      scene.add(lampGroup);

      const buildingConfigs = [
        { x: -6.8, z: -7.5, w: 5.5, h: 11, d: 5, color: 0x0f172a },
        { x: -1.2, z: -9.5, w: 6.2, h: 14, d: 5.5, color: 0x111827 },
        { x: 5.2, z: -8.0, w: 6.0, h: 12, d: 5, color: 0x0d1323 },
        { x: 10.5, z: -5.5, w: 4.8, h: 9.5, d: 5, color: 0x131b2e }
      ];

      const winWarm = new THREE.MeshBasicMaterial({ color: 0xfde68a });
      const winCool = new THREE.MeshBasicMaterial({ color: 0x7dd3fc });

      buildingConfigs.forEach((b, idx) => {
        const bMesh = new THREE.Mesh(
          new THREE.BoxGeometry(b.w, b.h, b.d),
          new THREE.MeshStandardMaterial({ color: b.color, roughness: 0.9 })
        );
        bMesh.position.set(b.x, b.h / 2, b.z);
        scene.add(bMesh);

        for (let row = 0; row < 4; row++) {
          for (let col = -1; col <= 1; col++) {
            if ((row + col + idx) % 2 === 0) {
              const win = new THREE.Mesh(
                new THREE.PlaneGeometry(0.55, 0.75),
                (row + idx) % 3 === 0 ? winWarm : winCool
              );
              win.position.set(
                b.x + col * 1.35,
                2.5 + row * 1.9,
                b.z + b.d / 2 + 0.02

              scene.add(win);
            }
          }
        }

      const signBoard = new THREE.Mesh(
        new THREE.BoxGeometry(1.6, 1.1, 0.2),

      );
      signBoard.position.set(-4.3, 4.2, -4.95);
      scene.add(signBoard);
