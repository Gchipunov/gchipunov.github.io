<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowy RTS Scene Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111827; color: #e5e7eb; font-family: 'Inter', sans-serif; touch-action: none; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; }
        
        /* Hide scrollbar for the horizontal tool hotbar */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col h-screen antialiased selection:bg-blue-500/30">

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Hidden Video Element for VideoTexture -->
    <video id="billboard-video" loop playsinline crossorigin="anonymous" preload="auto" style="display:none;" muted>
        <source src="ScreenRecording_11-16-2026%2020-36-12_1.mp4" type="video/mp4">
    </video>

    <!-- Floating Top Left Controls -->
    <div class="absolute top-4 left-4 flex flex-col gap-2 z-10 pointer-events-auto">
        <button id="btn-play-video" onclick="toggleVideo()" class="bg-gray-900/80 backdrop-blur border border-gray-700 p-2 sm:px-4 sm:py-2 rounded-xl shadow-lg text-xs sm:text-sm font-medium text-green-400 hover:bg-gray-800 transition-colors flex items-center justify-center">
            ▶️ <span class="hidden sm:inline ml-2">Video</span>
        </button>
        <button onclick="clearScene()" class="bg-gray-900/80 backdrop-blur border border-gray-700 p-2 sm:px-4 sm:py-2 rounded-xl shadow-lg text-xs sm:text-sm font-medium text-red-400 hover:bg-gray-800 transition-colors flex items-center justify-center">
            🗑️ <span class="hidden sm:inline ml-2">Clear</span>
        </button>
    </div>

    <!-- Floating Top Center Mode Switch -->
    <div class="absolute top-4 left-1/2 transform -translate-x-1/2 flex bg-gray-900/90 backdrop-blur border border-gray-700 p-1 rounded-full shadow-2xl z-10 pointer-events-auto">
        <button id="btn-build-mode" onclick="setMode('build')" class="px-5 py-2 rounded-full text-xs sm:text-sm font-bold bg-blue-600 text-white shadow-inner transition-all">
            🔨 Build
        </button>
        <button id="btn-delete-mode" onclick="setMode('delete')" class="px-5 py-2 rounded-full text-xs sm:text-sm font-bold text-gray-400 hover:text-white transition-all">
            🚫 Delete
        </button>
    </div>

    <!-- Floating Bottom Hotbar (Tools) -->
    <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 w-[95%] max-w-4xl z-10 pointer-events-auto">
        <div class="flex overflow-x-auto gap-2 p-2 bg-gray-900/90 backdrop-blur border border-gray-700 rounded-2xl shadow-2xl items-center pb-2 hide-scroll">
            
            <button class="build-item flex-shrink-0 w-16 h-16 sm:w-20 sm:h-20 border-2 border-blue-500 bg-blue-600/30 rounded-xl flex flex-col items-center justify-center transition-all focus:outline-none" onclick="selectItem('hq', this)">
                <div class="text-2xl sm:text-3xl mb-1 drop-shadow-md">🏢</div>
                <span class="text-[9px] sm:text-xs font-bold text-gray-100">HQ</span>
            </button>
            <button class="build-item flex-shrink-0 w-16 h-16 sm:w-20 sm:h-20 border-2 border-transparent hover:border-gray-500 bg-gray-800/80 rounded-xl flex flex-col items-center justify-center transition-all focus:outline-none" onclick="selectItem('tent', this)">
                <div class="text-2xl sm:text-3xl mb-1 drop-shadow-md">⛺</div>
                <span class="text-[9px] sm:text-xs font-medium text-gray-300">Barracks</span>
            </button>
            <button class="build-item flex-shrink-0 w-16 h-16 sm:w-20 sm:h-20 border-2 border-transparent hover:border-gray-500 bg-gray-800/80 rounded-xl flex flex-col items-center justify-center transition-all focus:outline-none" onclick="selectItem('tower', this)">
                <div class="text-2xl sm:text-3xl mb-1 drop-shadow-md">🗼</div>
                <span class="text-[9px] sm:text-xs font-medium text-gray-300">Tower</span>
            </button>
            <button class="build-item flex-shrink-0 w-16 h-16 sm:w-20 sm:h-20 border-2 border-transparent hover:border-gray-500 bg-gray-800/80 rounded-xl flex flex-col items-center justify-center transition-all focus:outline-none" onclick="selectItem('tank', this)">
                <div class="text-2xl sm:text-3xl mb-1 drop-shadow-md">🚜</div>
                <span class="text-[9px] sm:text-xs font-medium text-gray-300">Vehicle</span>
            </button>
            <button class="build-item flex-shrink-0 w-16 h-16 sm:w-20 sm:h-20 border-2 border-transparent hover:border-gray-500 bg-gray-800/80 rounded-xl flex flex-col items-center justify-center transition-all focus:outline-none" onclick="selectItem('tree', this)">
                <div class="text-2xl sm:text-3xl mb-1 drop-shadow-md">🌲</div>
                <span class="text-[9px] sm:text-xs font-medium text-gray-300">Pine</span>
            </button>
            <button class="build-item flex-shrink-0 w-16 h-16 sm:w-20 sm:h-20 border-2 border-transparent hover:border-gray-500 bg-gray-800/80 rounded-xl flex flex-col items-center justify-center transition-all focus:outline-none" onclick="selectItem('billboard', this)">
                <div class="text-2xl sm:text-3xl mb-1 drop-shadow-md">📺</div>
                <span class="text-[9px] sm:text-xs font-medium text-gray-300">Video</span>
            </button>

            <!-- New Terrain Tools -->
            <div class="w-px h-12 bg-gray-700 mx-1 flex-shrink-0"></div>

            <button class="build-item flex-shrink-0 w-16 h-16 sm:w-20 sm:h-20 border-2 border-transparent hover:border-gray-500 bg-gray-800/80 rounded-xl flex flex-col items-center justify-center transition-all focus:outline-none" onclick="selectItem('road', this)">
                <div class="text-2xl sm:text-3xl mb-1 drop-shadow-md">🛣️</div>
                <span class="text-[9px] sm:text-xs font-medium text-gray-300">Road</span>
            </button>
            <button class="build-item flex-shrink-0 w-16 h-16 sm:w-20 sm:h-20 border-2 border-transparent hover:border-gray-500 bg-gray-800/80 rounded-xl flex flex-col items-center justify-center transition-all focus:outline-none" onclick="selectItem('grass', this)">
                <div class="text-2xl sm:text-3xl mb-1 drop-shadow-md">🟩</div>
                <span class="text-[9px] sm:text-xs font-medium text-gray-300">Grass</span>
            </button>
            <button class="build-item flex-shrink-0 w-16 h-16 sm:w-20 sm:h-20 border-2 border-transparent hover:border-gray-500 bg-gray-800/80 rounded-xl flex flex-col items-center justify-center transition-all focus:outline-none" onclick="selectItem('dirt', this)">
                <div class="text-2xl sm:text-3xl mb-1 drop-shadow-md">🟫</div>
                <span class="text-[9px] sm:text-xs font-medium text-gray-300">Dirt</span>
            </button>

        </div>
    </div>

    <!-- Status Message -->
    <div id="status-message" class="absolute top-20 left-1/2 transform -translate-x-1/2 bg-gray-900/90 text-white px-4 py-2 rounded-full text-sm backdrop-blur-sm border border-gray-700 shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none z-20">
        Ready
    </div>

    <script>
        // --- Globals & State ---
        let scene, camera, renderer, controls;
        let gridHelper, plane;
        let raycaster, mouse;
        let snowParticles, snowSystem;
        
        // Materials
        const materials = {
            snow: new THREE.MeshLambertMaterial({ color: 0xffffff }),
            hqBase: new THREE.MeshLambertMaterial({ color: 0x374151 }), // Gray 700
            hqTop: new THREE.MeshLambertMaterial({ color: 0x1e3a8a }), // Blue 900
            tent: new THREE.MeshLambertMaterial({ color: 0x064e3b }), // Emerald 900
            towerBase: new THREE.MeshLambertMaterial({ color: 0x4b5563 }), // Gray 600
            tankBody: new THREE.MeshLambertMaterial({ color: 0x14532d }), // Green 900
            tankTrack: new THREE.MeshLambertMaterial({ color: 0x111827 }),
            treeLeaves: new THREE.MeshLambertMaterial({ color: 0x065f46 }), // Emerald 800
            treeTrunk: new THREE.MeshLambertMaterial({ color: 0x78350f }), // Amber 900
            billboardFrame: new THREE.MeshLambertMaterial({ color: 0x111827 }),
            road: new THREE.MeshLambertMaterial({ color: 0x27272a }), // Zinc 800
            roadMark: new THREE.MeshBasicMaterial({ color: 0xfacc15 }), // Yellow
            grass: new THREE.MeshLambertMaterial({ color: 0x4ade80 }), // Green
            dirt: new THREE.MeshLambertMaterial({ color: 0x92400e }), // Amber/Brown
            ghost: new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.5, wireframe: true }),
            ghostError: new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.5, wireframe: true })
        };

        let videoTexture = null;

        const state = {
            mode: 'build', // 'build' | 'delete'
            selectedItem: 'hq',
            placedObjects: [],
            objectCounter: 0,
            gridSize: 2, // Size of a grid cell
            isVideoPlaying: false
        };

        // Ghost object for placement preview
        let ghostMesh = new THREE.Group();

        init();
        animate();

        // --- Initialization ---
        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xa0c4ff); // Winter sky blue
            scene.fog = new THREE.Fog(0xa0c4ff, 20, 150);

            // 2. Camera (Perspective for full 3D)
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // Set 3D angle
            camera.position.set(30, 40, 40);
            camera.lookAt(scene.position);
            
            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 4. Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(30, 50, 20);
            dirLight.castShadow = true;
            dirLight.shadow.camera.left = -30;
            dirLight.shadow.camera.right = 30;
            dirLight.shadow.camera.top = 30;
            dirLight.shadow.camera.bottom = -30;
            dirLight.shadow.camera.near = 0.1;
            dirLight.shadow.camera.far = 100;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // 5. Environment (Ground & Grid)
            const planeGeo = new THREE.PlaneGeometry(200, 200);
            plane = new THREE.Mesh(planeGeo, materials.snow);
            plane.rotation.x = -Math.PI / 2;
            plane.receiveShadow = true;
            plane.name = "Ground";
            scene.add(plane);

            gridHelper = new THREE.GridHelper(200, 100, 0x000000, 0x000000);
            gridHelper.position.y = 0.01; // Prevent Z-fighting
            gridHelper.material.opacity = 0.15;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);

            // 6. Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableRotate = true; // Enable 3D rotation
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxZoom = 3;
            controls.minZoom = 0.5;
            // Prevent camera from going below ground
            controls.maxPolarAngle = Math.PI / 2 - 0.01; 

            // 7. Raycaster & Interactions
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Use pointer events to differentiate between drag (pan) and tap (click) on mobile
            renderer.domElement.addEventListener('pointermove', onPointerMove);
            renderer.domElement.addEventListener('pointerdown', onPointerDown);
            renderer.domElement.addEventListener('pointerup', onPointerUp);
            window.addEventListener('resize', onWindowResize);

            // 8. Video Texture Setup
            const video = document.getElementById('billboard-video');
            videoTexture = new THREE.VideoTexture(video);
            videoTexture.minFilter = THREE.LinearFilter;
            videoTexture.magFilter = THREE.LinearFilter;
            videoTexture.format = THREE.RGBFormat;
            
            // 9. Snow Particle System
            createSnow();

            // 10. Initial Ghost
            updateGhostModel();
            scene.add(ghostMesh);
        }

        // --- Procedural Modeling Generators ---

        function createModel(type, isGhost = false) {
            const group = new THREE.Group();
            group.userData.type = type;

            const applyMat = (mesh, actualMat) => {
                mesh.material = isGhost ? materials.ghost : actualMat;
                if (!isGhost) {
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                }
            };

            switch(type) {
                case 'hq':
                    // Base
                    const hqBaseGeo = new THREE.BoxGeometry(4, 2, 4);
                    const hqBase = new THREE.Mesh(hqBaseGeo);
                    hqBase.position.y = 1;
                    applyMat(hqBase, materials.hqBase);
                    group.add(hqBase);
                    // Top
                    const hqTopGeo = new THREE.BoxGeometry(2, 1, 2);
                    const hqTop = new THREE.Mesh(hqTopGeo);
                    hqTop.position.y = 2.5;
                    applyMat(hqTop, materials.hqTop);
                    group.add(hqTop);
                    // Antenna
                    const antGeo = new THREE.CylinderGeometry(0.05, 0.05, 2);
                    const ant = new THREE.Mesh(antGeo);
                    ant.position.set(1, 3, -1);
                    applyMat(ant, materials.hqBase);
                    group.add(ant);
                    break;
                
                case 'tent':
                    // Triangle prism-like using CylinderGeometry with 3 segments
                    const tentGeo = new THREE.CylinderGeometry(1.5, 1.5, 3, 3);
                    const tent = new THREE.Mesh(tentGeo);
                    tent.rotation.z = Math.PI / 2;
                    tent.rotation.x = Math.PI / 2;
                    tent.position.y = 0.75;
                    applyMat(tent, materials.tent);
                    group.add(tent);
                    break;

                case 'tower':
                    const towerBaseGeo = new THREE.CylinderGeometry(0.8, 1.2, 4, 8);
                    const towerBase = new THREE.Mesh(towerBaseGeo);
                    towerBase.position.y = 2;
                    applyMat(towerBase, materials.towerBase);
                    group.add(towerBase);
                    
                    const towerTopGeo = new THREE.BoxGeometry(2, 1, 2);
                    const towerTop = new THREE.Mesh(towerTopGeo);
                    towerTop.position.y = 4.5;
                    applyMat(towerTop, materials.hqBase);
                    group.add(towerTop);
                    break;

                case 'tank':
                    // Tracks
                    const trackGeo = new THREE.BoxGeometry(2.4, 0.6, 3.2);
                    const track = new THREE.Mesh(trackGeo);
                    track.position.y = 0.3;
                    applyMat(track, materials.tankTrack);
                    group.add(track);
                    // Body
                    const bodyGeo = new THREE.BoxGeometry(1.8, 0.8, 2.6);
                    const body = new THREE.Mesh(bodyGeo);
                    body.position.y = 1;
                    applyMat(body, materials.tankBody);
                    group.add(body);
                    // Turret
                    const turretGeo = new THREE.BoxGeometry(1.2, 0.6, 1.4);
                    const turret = new THREE.Mesh(turretGeo);
                    turret.position.set(0, 1.7, -0.2);
                    applyMat(turret, materials.tankBody);
                    group.add(turret);
                    // Barrel
                    const barrelGeo = new THREE.CylinderGeometry(0.1, 0.1, 1.5);
                    const barrel = new THREE.Mesh(barrelGeo);
                    barrel.rotation.x = Math.PI / 2;
                    barrel.position.set(0, 1.7, 1);
                    applyMat(barrel, materials.towerBase);
                    group.add(barrel);
                    break;

                case 'tree':
                    const trunkGeo = new THREE.CylinderGeometry(0.2, 0.3, 1);
                    const trunk = new THREE.Mesh(trunkGeo);
                    trunk.position.y = 0.5;
                    applyMat(trunk, materials.treeTrunk);
                    group.add(trunk);

                    const leavesGeo1 = new THREE.ConeGeometry(1.2, 2, 8);
                    const leaves1 = new THREE.Mesh(leavesGeo1);
                    leaves1.position.y = 1.5;
                    applyMat(leaves1, materials.treeLeaves);
                    group.add(leaves1);

                    const leavesGeo2 = new THREE.ConeGeometry(0.9, 1.5, 8);
                    const leaves2 = new THREE.Mesh(leavesGeo2);
                    leaves2.position.y = 2.5;
                    applyMat(leaves2, materials.treeLeaves);
                    group.add(leaves2);
                    break;

                case 'billboard':
                    const standGeo = new THREE.BoxGeometry(0.4, 3, 0.4);
                    const stand1 = new THREE.Mesh(standGeo);
                    stand1.position.set(-2, 1.5, 0);
                    applyMat(stand1, materials.billboardFrame);
                    group.add(stand1);

                    const stand2 = new THREE.Mesh(standGeo);
                    stand2.position.set(2, 1.5, 0);
                    applyMat(stand2, materials.billboardFrame);
                    group.add(stand2);

                    const screenBackGeo = new THREE.BoxGeometry(4.4, 2.6, 0.2);
                    const screenBack = new THREE.Mesh(screenBackGeo);
                    screenBack.position.set(0, 3, -0.1);
                    applyMat(screenBack, materials.billboardFrame);
                    group.add(screenBack);

                    // Screen with Video
                    const screenGeo = new THREE.PlaneGeometry(4.2, 2.4);
                    let screenMat;
                    if (isGhost) {
                        screenMat = materials.ghost;
                    } else {
                        // Make sure we have a fresh material for each actual billboard
                        screenMat = new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.DoubleSide });
                    }
                    const screen = new THREE.Mesh(screenGeo, screenMat);
                    screen.position.set(0, 3, 0.01);
                    if (!isGhost) screen.name = "VideoScreen";
                    group.add(screen);
                    break;
                
                case 'road':
                    const roadGeo = new THREE.PlaneGeometry(state.gridSize, state.gridSize);
                    const roadMesh = new THREE.Mesh(roadGeo);
                    roadMesh.rotation.x = -Math.PI / 2;
                    roadMesh.position.y = 0.05; // Slightly above ground
                    applyMat(roadMesh, materials.road);
                    
                    const markGeo = new THREE.PlaneGeometry(0.2, state.gridSize);
                    const markMesh = new THREE.Mesh(markGeo);
                    markMesh.rotation.x = -Math.PI / 2;
                    markMesh.position.y = 0.06;
                    applyMat(markMesh, materials.roadMark);
                    
                    group.add(roadMesh);
                    group.add(markMesh);
                    break;

                case 'grass':
                    const grassGeo = new THREE.PlaneGeometry(state.gridSize, state.gridSize);
                    const grassMesh = new THREE.Mesh(grassGeo);
                    grassMesh.rotation.x = -Math.PI / 2;
                    grassMesh.position.y = 0.03;
                    applyMat(grassMesh, materials.grass);
                    group.add(grassMesh);
                    break;

                case 'dirt':
                    const dirtGeo = new THREE.PlaneGeometry(state.gridSize, state.gridSize);
                    const dirtMesh = new THREE.Mesh(dirtGeo);
                    dirtMesh.rotation.x = -Math.PI / 2;
                    dirtMesh.position.y = 0.02;
                    applyMat(dirtMesh, materials.dirt);
                    group.add(dirtMesh);
                    break;
            }

            return group;
        }

        // --- Interaction Logic ---

        function updateGhostModel() {
            scene.remove(ghostMesh);
            ghostMesh = createModel(state.selectedItem, true);
            scene.add(ghostMesh);
        }

        function getIntersects(event) {
            // Calculate mouse position in normalized device coordinates (-1 to +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            if (state.mode === 'build') {
                return raycaster.intersectObject(plane);
            } else {
                // In delete mode, intersect with placed objects
                // Flatten the hierarchy to find meshes, then find their top-level group parent
                const intersects = raycaster.intersectObjects(state.placedObjects, true);
                return intersects;
            }
        }

        function onPointerMove(event) {
            const intersects = getIntersects(event);

            if (state.mode === 'build') {
                if (intersects.length > 0) {
                    ghostMesh.visible = true;
                    const p = intersects[0].point;
                    
                    // Snap to grid
                    const s = state.gridSize;
                    const snappedX = Math.round(p.x / s) * s;
                    const snappedZ = Math.round(p.z / s) * s;
                    
                    ghostMesh.position.set(snappedX, 0, snappedZ);

                    // Optional collision check for red ghost (not fully implemented for brevity, just keeping it visual)
                    // You could check if snapped coords exist in placedObjects bounding boxes.
                } else {
                    ghostMesh.visible = false;
                }
            } else {
                ghostMesh.visible = false;
            }
        }

        let pointerDownPos = { x: 0, y: 0 };
        
        function onPointerDown(event) {
            pointerDownPos.x = event.clientX;
            pointerDownPos.y = event.clientY;
        }

        function onPointerUp(event) {
            // Prevent triggering placement if the user was dragging/panning the camera
            const dist = Math.hypot(event.clientX - pointerDownPos.x, event.clientY - pointerDownPos.y);
            if (dist < 10) { 
                handleCanvasClick(event);
            }
        }

        function handleCanvasClick(event) {
            // Prevent placing if right click
            if (event.button !== 0 && event.button !== undefined) return;

            const intersects = getIntersects(event);

            if (state.mode === 'build') {
                if (intersects.length > 0) {
                    const p = intersects[0].point;
                    const s = state.gridSize;
                    const snappedX = Math.round(p.x / s) * s;
                    const snappedZ = Math.round(p.z / s) * s;

                    // Check for overlap
                    const isOccupied = state.placedObjects.some(obj => {
                        return obj.position.x === snappedX && obj.position.z === snappedZ;
                    });

                    if (isOccupied) {
                        showStatus("Location occupied!");
                        return;
                    }

                    placeObject(state.selectedItem, snappedX, snappedZ);
                }
            } else if (state.mode === 'delete') {
                if (intersects.length > 0) {
                    // Find the root group of the intersected mesh
                    let object = intersects[0].object;
                    while (object.parent && object.parent !== scene) {
                        object = object.parent;
                    }
                    
                    if (state.placedObjects.includes(object)) {
                        removeObject(object);
                    }
                }
            }
        }

        // --- Core Functions ---

        function placeObject(type, x, z) {
            const obj = createModel(type, false);
            obj.position.set(x, 0, z);
            state.objectCounter++;
            const id = `${type.toUpperCase()}_${state.objectCounter}`;
            obj.userData.id = id;
            obj.userData.timestamp = new Date().toLocaleTimeString();
            
            scene.add(obj);
            state.placedObjects.push(obj);
            
            updateOutliner();
            showStatus(`Built ${type}`);
            
            // Auto play video if it's a billboard and video is enabled
            if (type === 'billboard' && state.isVideoPlaying) {
               // Video plays automatically as it's the same HTML element texture
            }
        }

        function removeObject(object) {
            scene.remove(object);
            state.placedObjects = state.placedObjects.filter(obj => obj !== object);
            showStatus(`Removed ${object.userData.id}`);
        }

        function clearScene() {
            state.placedObjects.forEach(obj => scene.remove(obj));
            state.placedObjects = [];
            state.objectCounter = 0;
            showStatus("Scene Cleared");
        }

        // --- Snow System ---
        function createSnow() {
            const particleCount = 1500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                // X, Y, Z
                positions[i] = (Math.random() - 0.5) * 100;
                positions[i + 1] = Math.random() * 50;
                positions[i + 2] = (Math.random() - 0.5) * 100;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const pMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.3,
                transparent: true,
                opacity: 0.8
            });

            snowSystem = new THREE.Points(geometry, pMaterial);
            scene.add(snowSystem);
        }

        function animateSnow() {
            if (!snowSystem) return;
            const positions = snowSystem.geometry.attributes.position.array;
            
            for (let i = 1; i < positions.length; i += 3) {
                positions[i] -= 0.1; // Fall speed
                // Slight horizontal drift
                positions[i-1] += (Math.random() - 0.5) * 0.05; 

                if (positions[i] < 0) {
                    positions[i] = 50; // Reset to top
                    positions[i-1] = (Math.random() - 0.5) * 100; // Reset X
                }
            }
            snowSystem.geometry.attributes.position.needsUpdate = true;
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            animateSnow();
            renderer.render(scene, camera);
        }

        // --- UI & State Handling ---

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Exposed to Global scope for UI buttons
        window.setMode = function(mode) {
            state.mode = mode;
            
            const btnBuild = document.getElementById('btn-build-mode');
            const btnDelete = document.getElementById('btn-delete-mode');

            if (mode === 'build') {
                btnBuild.className = "px-5 py-2 rounded-full text-xs sm:text-sm font-bold bg-blue-600 text-white shadow-inner transition-all";
                btnDelete.className = "px-5 py-2 rounded-full text-xs sm:text-sm font-bold text-gray-400 hover:text-white transition-all";
                ghostMesh.visible = true;
            } else {
                btnBuild.className = "px-5 py-2 rounded-full text-xs sm:text-sm font-bold text-gray-400 hover:text-white transition-all";
                btnDelete.className = "px-5 py-2 rounded-full text-xs sm:text-sm font-bold bg-red-600 text-white shadow-inner transition-all";
                ghostMesh.visible = false;
            }
        };

        window.selectItem = function(item, btnElement) {
            state.selectedItem = item;
            window.setMode('build');
            updateGhostModel();
            
            // Update UI hotbar classes
            document.querySelectorAll('.build-item').forEach(el => {
                el.classList.remove('border-blue-500', 'bg-blue-600/30');
                el.classList.add('border-transparent', 'bg-gray-800/80');
            });
            
            btnElement.classList.add('border-blue-500', 'bg-blue-600/30');
            btnElement.classList.remove('border-transparent', 'bg-gray-800/80');
        };

        window.toggleVideo = function() {
            const video = document.getElementById('billboard-video');
            const btn = document.getElementById('btn-play-video');
            
            if (state.isVideoPlaying) {
                video.pause();
                btn.innerHTML = '▶️ Play Billboards';
                btn.classList.remove('bg-green-700', 'text-white');
                btn.classList.add('bg-green-900/50', 'text-green-300');
            } else {
                // Must play muted first due to browser autoplay policies, though we set muted in HTML
                video.play().then(() => {
                    btn.innerHTML = '⏸️ Pause Billboards';
                    btn.classList.add('bg-green-700', 'text-white');
                    btn.classList.remove('bg-green-900/50', 'text-green-300');
                }).catch(e => {
                    console.error("Video play failed", e);
                    showStatus("Video playback aborted (Check path/CORS)");
                });
            }
            state.isVideoPlaying = !state.isVideoPlaying;
        };

        let statusTimeout;
        function showStatus(msg) {
            const el = document.getElementById('status-message');
            el.innerText = msg;
            el.classList.remove('opacity-0');
            el.classList.add('opacity-100');
            
            clearTimeout(statusTimeout);
            statusTimeout = setTimeout(() => {
                el.classList.remove('opacity-100');
                el.classList.add('opacity-0');
            }, 2000);
        }

    </script>
</body>
</html>
