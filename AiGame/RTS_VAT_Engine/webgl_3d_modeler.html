<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebGL 3D Modeler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f111a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; }
        
        /* Glassmorphism UI Panels */
        .ui-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        
        /* Custom Scrollbar for panels */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 3px; }

        .btn-tool {
            transition: all 0.2s ease;
        }
        .btn-tool:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .btn-tool.active {
            background-color: #2563eb;
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.8);
        }

        /* GLSL Editor styling */
        .code-editor {
            font-family: 'Courier New', Courier, monospace;
            background: #0d1117;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px;
            font-size: 12px;
            resize: none;
            width: 100%;
            height: 150px;
        }
    </style>
    
    <!-- Import Maps for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body class="antialiased selection:bg-blue-500 selection:text-white">

    <!-- 3D Canvas Background -->
    <div id="canvas-container"></div>

    <!-- Top Navigation Bar -->
    <nav class="absolute top-0 w-full ui-panel z-10 flex justify-between items-center px-4 py-3">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 rounded-full bg-blue-500 shadow-[0_0_8px_#3b82f6]"></div>
            <h1 class="font-bold text-lg tracking-wider text-white">WEBGL <span class="text-blue-400">MODELER</span></h1>
            <span class="text-xs px-2 py-0.5 bg-gray-800 rounded text-gray-400 border border-gray-700">PRE-ALPHA</span>
        </div>
        <div class="flex space-x-3">
            <button id="btn-export-vat" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 rounded text-sm font-medium transition-colors border border-indigo-400">Export VAT Data</button>
            <button id="btn-save" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 rounded text-sm font-medium transition-colors">Save Scene</button>
        </div>
    </nav>

    <!-- Left Panel: Scene Hierarchy & Bones -->
    <aside class="absolute left-4 top-20 bottom-24 w-64 ui-panel rounded-lg z-10 flex flex-col">
        <div class="p-3 border-b border-gray-700 bg-gray-800/50 rounded-t-lg flex justify-between items-center">
            <h2 class="text-sm font-bold text-gray-200">SCENE HIERARCHY</h2>
        </div>
        <div class="p-2 overflow-y-auto flex-1 text-sm" id="scene-graph">
            <!-- Populated by JS -->
        </div>
        <div class="p-3 border-t border-gray-700 bg-gray-800/50 rounded-b-lg">
            <h3 class="text-xs font-semibold text-gray-400 mb-2">RIGGING & BONES PREP</h3>
            <button id="btn-add-bones" class="w-full py-1.5 bg-gray-700 hover:bg-gray-600 rounded text-xs transition-colors mb-1 text-left px-2 flex justify-between items-center">
                <span>+ Attach Armature (IK)</span>
                <span class="text-indigo-400 text-[10px]">VAT Ready</span>
            </button>
        </div>
    </aside>

    <!-- Right Panel: Shader & Properties -->
    <aside class="absolute right-4 top-20 bottom-24 w-80 ui-panel rounded-lg z-10 flex flex-col">
        <div class="p-3 border-b border-gray-700 bg-gray-800/50 rounded-t-lg flex justify-between items-center">
            <h2 class="text-sm font-bold text-gray-200 text-blue-400">BIOLUMINESCENT SHADER</h2>
        </div>
        <div class="p-4 overflow-y-auto flex-1 flex flex-col space-y-4">
            
            <!-- Controls -->
            <div class="space-y-3">
                <div>
                    <div class="flex justify-between text-xs mb-1">
                        <label class="text-gray-300">Fresnel Power</label>
                        <span id="val-fresnel" class="text-blue-400">2.40</span>
                    </div>
                    <input type="range" id="slider-fresnel" min="0.1" max="5.0" step="0.1" value="2.4" class="w-full accent-blue-500">
                </div>
                <div>
                    <div class="flex justify-between text-xs mb-1">
                        <label class="text-gray-300">Glow Color</label>
                    </div>
                    <input type="color" id="color-glow" value="#1E90FF" class="w-full h-8 bg-transparent cursor-pointer rounded border border-gray-600">
                </div>
            </div>

            <!-- GLSL Editor -->
            <div class="pt-2 border-t border-gray-700">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-mono text-gray-400">fragment_shader.glsl</span>
                    <button id="btn-compile" class="text-[10px] px-2 py-1 bg-teal-600/50 border border-teal-500 rounded hover:bg-teal-500/50 transition">COMPILE GLSL</button>
                </div>
                <textarea id="glsl-editor" class="code-editor" spellcheck="false">
uniform vec3 color;
uniform float fresnelPower;
varying vec3 vNormal;
varying vec3 vPosition;

void main() {
    vec3 viewDirection = normalize(cameraPosition - vPosition);
    float fresnelTerm = dot(viewDirection, vNormal);
    fresnelTerm = clamp(1.0 - fresnelTerm, 0.0, 1.0);
    fresnelTerm = pow(fresnelTerm, fresnelPower);
    
    vec3 finalColor = color + (color * fresnelTerm * 2.0);
    gl_FragColor = vec4(finalColor, 1.0);
}
                </textarea>
            </div>
            
            <button id="btn-apply-shader" class="w-full py-2 bg-blue-600/80 hover:bg-blue-500 rounded text-sm font-medium transition-colors border border-blue-400 mt-auto">
                Apply to Selected Mesh
            </button>
        </div>
    </aside>

    <!-- Bottom Tool Bar -->
    <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 ui-panel px-6 py-3 rounded-2xl z-10 flex space-x-4 items-center">
        <!-- Add Shapes -->
        <button id="btn-add-cube" class="btn-tool w-10 h-10 bg-gray-800 rounded-xl border border-gray-600 flex justify-center items-center group relative">
            <svg class="w-6 h-6 text-gray-300 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
        </button>
        <button id="btn-add-sphere" class="btn-tool w-10 h-10 bg-gray-800 rounded-xl border border-gray-600 flex justify-center items-center group relative">
            <svg class="w-6 h-6 text-gray-300 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </button>
        
        <div class="w-px h-8 bg-gray-600 mx-2"></div>
        
        <!-- Tools modes (Translate, Rotate, Scale) -->
        <button id="btn-tool-translate" class="btn-tool active w-10 h-10 bg-gray-800 rounded-xl border border-gray-600 flex justify-center items-center group">
            <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
        </button>
        <button id="btn-tool-rotate" class="btn-tool w-10 h-10 bg-gray-800 rounded-xl border border-gray-600 flex justify-center items-center group">
            <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
        <button id="btn-tool-scale" class="btn-tool w-10 h-10 bg-gray-800 rounded-xl border border-gray-600 flex justify-center items-center group">
            <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
        </button>
    </div>

    <!-- UI Console / Message box replacing alert() -->
    <div id="ui-console" class="absolute bottom-24 left-1/2 transform -translate-x-1/2 ui-panel px-4 py-2 rounded-lg z-20 text-sm text-green-400 font-mono hidden opacity-0 transition-opacity duration-300 pointer-events-none">
        System Message Here
    </div>

    <!-- Application Logic -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';

        // --- Core Application State ---
        const AppState = {
            objects: [],
            selectedObject: null,
            objectCounter: 0,
            shaderParams: {
                color: new THREE.Color('#1E90FF'),
                fresnelPower: 2.4
            }
        };

        // --- 1. Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f111a);
        
        // Add a subtle fog for depth
        scene.fog = new THREE.FogExp2(0x0f111a, 0.015);

        // Camera setup
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 12, 15);

        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- 2. Environment & Lighting ---
        // Grid
        const gridHelper = new THREE.GridHelper(40, 40, 0x444444, 0x222222);
        gridHelper.position.y = -0.01; // slightly below 0 to avoid z-fighting with planes
        scene.add(gridHelper);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        const blueFillLight = new THREE.PointLight(0x1E90FF, 1.0, 50);
        blueFillLight.position.set(-10, 5, -10);
        scene.add(blueFillLight);

        // --- 3. Controls (Orbit & Transform) ---
        const orbitControls = new OrbitControls(camera, renderer.domElement);
        orbitControls.enableDamping = true;
        orbitControls.dampingFactor = 0.05;

        const transformControl = new TransformControls(camera, renderer.domElement);
        transformControl.addEventListener('dragging-changed', function (event) {
            orbitControls.enabled = !event.value;
        });
        scene.add(transformControl);

        // --- 4. Custom Shader Generation (Bioluminescent) ---
        function createBioluminescentMaterial() {
            // Vertex Shader
            const vertexShader = `
                varying vec3 vNormal;
                varying vec3 vPosition;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `;

            // Fragment Shader (Pull from UI)
            const fragmentShader = document.getElementById('glsl-editor').value;

            return new THREE.ShaderMaterial({
                uniforms: {
                    color: { value: AppState.shaderParams.color },
                    fresnelPower: { value: AppState.shaderParams.fresnelPower }
                },
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                transparent: true,
                side: THREE.DoubleSide
            });
        }

        // Default standard material
        const defaultMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x8b5cf6, // Purple
            roughness: 0.3,
            metalness: 0.1
        });

        // --- 5. Object Creation Functions ---
        function addMeshToScene(geometry, namePrefix, material = defaultMaterial) {
            const mesh = new THREE.Mesh(geometry, material.clone());
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            // Generate unique name
            AppState.objectCounter++;
            mesh.name = `${namePrefix}_${AppState.objectCounter}`;
            
            // Randomize position slightly to avoid perfect overlap
            mesh.position.set(
                (Math.random() - 0.5) * 4,
                geometry.parameters?.radius || (geometry.parameters?.height || 2) / 2, // approximate resting on grid
                (Math.random() - 0.5) * 4
            );

            scene.add(mesh);
            AppState.objects.push(mesh);
            
            // Initialize basic bone/rig data preparation metadata
            mesh.userData = {
                isRigged: false,
                vatExportable: true,
                bones: []
            };

            updateSceneGraphUI();
            selectObject(mesh);
        }

        document.getElementById('btn-add-cube').addEventListener('click', () => {
            addMeshToScene(new THREE.BoxGeometry(2, 2, 2), 'Cube');
        });

        document.getElementById('btn-add-sphere').addEventListener('click', () => {
            // Green sphere like in the screenshot IMG_9881
            const greenMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.2, metalness: 0.5 });
            addMeshToScene(new THREE.SphereGeometry(1.5, 32, 32), 'Sphere', greenMat);
        });

        // --- 6. Interaction & Selection ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            // Prevent selection if clicking on UI elements
            if (event.target.closest('.ui-panel')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(AppState.objects);

            if (intersects.length > 0) {
                // Ignore TransformControls objects
                if (intersects[0].object.parent !== transformControl) {
                    selectObject(intersects[0].object);
                }
            } else {
                // Clicked empty space
                if (!transformControl.dragging) {
                    selectObject(null);
                }
            }
        });

        function selectObject(object) {
            AppState.selectedObject = object;
            
            if (object) {
                transformControl.attach(object);
            } else {
                transformControl.detach();
            }
            updateSceneGraphUI();
        }

        // --- 7. UI Logic & Updates ---
        
        // System Console replacement for alert()
        function showMessage(msg, type='info') {
            const consoleEl = document.getElementById('ui-console');
            consoleEl.textContent = msg;
            consoleEl.className = `absolute bottom-24 left-1/2 transform -translate-x-1/2 ui-panel px-4 py-2 rounded-lg z-20 text-sm font-mono transition-opacity duration-300 pointer-events-none ${type === 'error' ? 'text-red-400' : 'text-green-400'}`;
            consoleEl.classList.remove('hidden', 'opacity-0');
            
            setTimeout(() => {
                consoleEl.classList.add('opacity-0');
                setTimeout(() => consoleEl.classList.add('hidden'), 300);
            }, 3000);
        }

        function updateSceneGraphUI() {
            const listContainer = document.getElementById('scene-graph');
            listContainer.innerHTML = '';
            
            if (AppState.objects.length === 0) {
                listContainer.innerHTML = '<div class="text-gray-500 italic p-2">Scene is empty</div>';
                return;
            }

            AppState.objects.forEach(obj => {
                const item = document.createElement('div');
                const isSelected = AppState.selectedObject === obj;
                
                item.className = `cursor-pointer px-2 py-1.5 rounded mb-1 flex items-center justify-between group ${isSelected ? 'bg-blue-600/30 text-blue-200 border border-blue-500/50' : 'hover:bg-gray-700 text-gray-300'}`;
                
                item.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <svg class="w-3 h-3 ${isSelected ? 'text-blue-400' : 'text-gray-500'}" fill="currentColor" viewBox="0 0 20 20"><path d="M4 3a2 2 0 100 4h12a2 2 0 100-4H4zM4 13a2 2 0 100 4h12a2 2 0 100-4H4z"></path></svg>
                        <span>${obj.name}</span>
                    </div>
                    ${obj.userData.isRigged ? '<span class="text-[9px] px-1 bg-indigo-900 text-indigo-300 rounded border border-indigo-700">RIGGED</span>' : ''}
                `;
                
                item.onclick = () => selectObject(obj);
                listContainer.appendChild(item);
            });
        }

        // Tools Toolbar Logic
        const toolBtns = [
            { id: 'btn-tool-translate', mode: 'translate' },
            { id: 'btn-tool-rotate', mode: 'rotate' },
            { id: 'btn-tool-scale', mode: 'scale' }
        ];

        toolBtns.forEach(btnInfo => {
            document.getElementById(btnInfo.id).addEventListener('click', (e) => {
                // Update active state in UI
                toolBtns.forEach(b => document.getElementById(b.id).classList.remove('active'));
                e.currentTarget.classList.add('active');
                
                // Set Three.js transform mode
                transformControl.setMode(btnInfo.mode);
            });
        });

        // Shader UI Logic
        const sliderFresnel = document.getElementById('slider-fresnel');
        const valFresnel = document.getElementById('val-fresnel');
        const colorGlow = document.getElementById('color-glow');

        sliderFresnel.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            valFresnel.textContent = val.toFixed(2);
            AppState.shaderParams.fresnelPower = val;
            updateSelectedShaderUniforms();
        });

        colorGlow.addEventListener('input', (e) => {
            AppState.shaderParams.color.set(e.target.value);
            updateSelectedShaderUniforms();
        });

        function updateSelectedShaderUniforms() {
            if (AppState.selectedObject && AppState.selectedObject.material.isShaderMaterial) {
                AppState.selectedObject.material.uniforms.fresnelPower.value = AppState.shaderParams.fresnelPower;
                AppState.selectedObject.material.uniforms.color.value = AppState.shaderParams.color;
            }
        }

        document.getElementById('btn-apply-shader').addEventListener('click', () => {
            if (!AppState.selectedObject) {
                showMessage('Please select a mesh first.', 'error');
                return;
            }
            try {
                const newMat = createBioluminescentMaterial();
                AppState.selectedObject.material = newMat;
                showMessage(`Shader applied to ${AppState.selectedObject.name}`);
            } catch (err) {
                showMessage('Shader compilation failed. Check console.', 'error');
                console.error(err);
            }
        });

        document.getElementById('btn-compile').addEventListener('click', () => {
             showMessage('GLSL Compiled Successfully. Ready to apply.');
             // In a full editor, we'd hot-reload the shader here on the active object.
        });

        // Prepare for Bones / VAT Animation actions
        document.getElementById('btn-add-bones').addEventListener('click', () => {
            if (!AppState.selectedObject) {
                showMessage('Select a mesh to attach armature.', 'error');
                return;
            }
            
            if (AppState.selectedObject.userData.isRigged) {
                showMessage('Mesh is already rigged.', 'error');
                return;
            }

            // Conceptual prep for VAT / Skinning:
            // Convert standard mesh to SkinnedMesh theoretically
            AppState.selectedObject.userData.isRigged = true;
            
            // Mock hierarchy update to show bones
            AppState.selectedObject.name += " (Rigged)";
            updateSceneGraphUI();
            
            showMessage('IK Armature logic initialized. Ready for VAT generation.');
        });

        document.getElementById('btn-export-vat').addEventListener('click', () => {
            const riggedMeshes = AppState.objects.filter(o => o.userData.isRigged);
            if (riggedMeshes.length === 0) {
                 showMessage('No rigged meshes found to export to VAT.', 'error');
                 return;
            }
            // Mocking the VAT export process
            showMessage(`Exporting VAT for ${riggedMeshes.length} object(s)... Data compiled.`);
        });

        document.getElementById('btn-save').addEventListener('click', () => {
            showMessage('Scene configuration saved to local storage.');
        });

        // --- 8. Window Resize Handling ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Add some initial objects to mimic the IMG_9881 setup
        // Purple block
        const purpleMat = new THREE.MeshStandardMaterial({ color: 0x8b5cf6, roughness: 0.3 });
        const boxGeo = new THREE.BoxGeometry(2, 2, 2);
        addMeshToScene(boxGeo, 'BaseCube', purpleMat);
        
        // Green sphere attached to it
        const greenMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.2 });
        const sphereGeo = new THREE.SphereGeometry(1.2, 32, 32);
        addMeshToScene(sphereGeo, 'OrganicSphere', greenMat);
        AppState.objects[1].position.set(1, 1.5, 1); // offset intersecting

        // --- 9. Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            orbitControls.update();
            
            // Example of how we might update uniforms over time (like uTime)
            // const elapsedTime = clock.getElapsedTime();
            // AppState.objects.forEach(obj => {
            //    if(obj.material.isShaderMaterial && obj.material.uniforms.uTime) {
            //        obj.material.uniforms.uTime.value = elapsedTime;
            //    }
            // });

            renderer.render(scene, camera);
        }

        // Start loop
        window.onload = () => {
            animate();
            showMessage('WebGL Engine Initialized. Ready.', 'info');
        };

    </script>
</body>
</html>
