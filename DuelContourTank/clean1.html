<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Terrain Simulator</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1e;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 12px 20px;
            background: #25252b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #383842;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .hud-stats {
            display: flex;
            gap: 16px;
            font-size: 0.9rem;
            color: #a0a0b0;
        }

        .hud-stats span {
            color: #ffffff;
            font-weight: 600;
        }

        #viewport-container {
            flex: 1;
            position: relative;
            width: 100%;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .controls-panel {
            padding: 12px 20px;
            background: #25252b;
            border-top: 1px solid #383842;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
        }

        label {
            color: #a0a0b0;
        }

        input[type="range"] {
            accent-color: #4fa0ff;
            cursor: pointer;
        }

        button {
            background: #4fa0ff;
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #70b2ff;
        }

        .instructions {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: #ccc;
            pointer-events: none;
        }
    </style>

    <!-- Essential WebGL Libraries Only -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <header>
        <h1>Tank Terrain Simulator</h1>
        <div class="hud-stats">
            <div>Shells: <span id="hud-shells">9999</span></div>
            <div>Status: <span id="hud-status">Ready</span></div>
        </div>
    </header>

    <div id="viewport-container">
        <div class="instructions">
            Left half drag: Drive / Turn &bull; Right half drag: Aim &bull; Tap Right: Fire
        </div>
    </div>

    <div class="controls-panel">
        <div class="control-group">
            <label for="slider-seed">Terrain Seed:</label>
            <input type="range" id="slider-seed" min="1" max="99999" value="12345" step="1">
            <span id="val-seed">12345</span>
        </div>

        <div class="control-group">
            <label for="slider-roughness">Roughness:</label>
            <input type="range" id="slider-roughness" min="0.1" max="2.0" value="0.8" step="0.1">
            <span id="val-roughness">0.8</span>
        </div>

        <button id="btn-reset">Reset Terrain</button>
    </div>

    <script>
        // --- State Management ---
        const state = {
            seed: 12345,
            roughness: 0.8,
            shells: 9999
        };

        // --- DOM Elements ---
        const container = document.getElementById('viewport-container');
        const hudShells = document.getElementById('hud-shells');
        const sliderSeed = document.getElementById('slider-seed');
        const sliderRoughness = document.getElementById('slider-roughness');
        const valSeed = document.getElementById('val-seed');
        const valRoughness = document.getElementById('val-roughness');
        const btnReset = document.getElementById('btn-reset');

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1e);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(25, 20, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2.1;

        // --- Lighting ---
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(10, 20, 10);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 1024;
        sun.shadow.mapSize.height = 1024;
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0x404040, 1.5));

        // --- Terrain System ---
        const GRID_SIZE = 40;
        const GRID_RES = 64;
        const geometry = new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE, GRID_RES - 1, GRID_RES - 1);
        geometry.rotateX(-Math.PI / 2);

        const material = new THREE.MeshStandardMaterial({ 
            color: 0x556b2f, 
            flatShading: true,
            roughness: 0.8
        });

        const terrain = new THREE.Mesh(geometry, material);
        terrain.receiveShadow = true;
        scene.add(terrain);

        const vertices = geometry.attributes.position.array;
        const originalHeights = new Float32Array(vertices.length / 3);

        function generateTerrain() {
            const s = state.seed / 1000;
            const r = state.roughness;
            for (let i = 0; i < originalHeights.length; i++) {
                const ix = i % GRID_RES;
                const iz = Math.floor(i / GRID_RES);
                const x = (ix / GRID_RES) * 10;
                const z = (iz / GRID_RES) * 10;
                
                const h = (Math.sin(x * r + s) * Math.cos(z * r + s * 1.1) + 
                          Math.sin(x * r * 0.5 - s * 0.5) * 0.5) * 3;
                
                originalHeights[i] = h;
                vertices[i * 3 + 1] = h;
            }
            geometry.attributes.position.needsUpdate = true;
            geometry.computeVertexNormals();
        }

        function applyDeformation(point, radius, depth) {
            let changed = false;
            for (let i = 0; i < originalHeights.length; i++) {
                const vx = vertices[i * 3];
                const vz = vertices[i * 3 + 2];
                const dx = vx - point.x;
                const dz = vz - point.z;
                const distSq = dx * dx + dz * dz;
                if (distSq < radius * radius) {
                    const dist = Math.sqrt(distSq);
                    const influence = 1 - (dist / radius);
                    vertices[i * 3 + 1] -= influence * depth;
                    changed = true;
                }
            }
            if (changed) {
                geometry.attributes.position.needsUpdate = true;
                geometry.computeVertexNormals();
            }
        }

        generateTerrain();

        // --- Tank Model ---
        const tankGroup = new THREE.Group();
        scene.add(tankGroup);

        const TANK_COLOR = 0x2f4f4f;
        const hull = new THREE.Mesh(
            new THREE.BoxGeometry(2.5, 0.8, 4),
            new THREE.MeshStandardMaterial({ color: TANK_COLOR })
        );
        hull.position.y = 0.4;
        hull.castShadow = true;
        tankGroup.add(hull);

        const turret = new THREE.Mesh(
            new THREE.BoxGeometry(1.5, 0.6, 1.8),
            new THREE.MeshStandardMaterial({ color: TANK_COLOR })
        );
        turret.position.y = 1.1;
        turret.castShadow = true;
        tankGroup.add(turret);

        const barrelPivot = new THREE.Group();
        barrelPivot.position.set(0, 1.1, 0.8);
        tankGroup.add(barrelPivot);

        const barrel = new THREE.Mesh(
            new THREE.CylinderGeometry(0.15, 0.15, 2.5),
            new THREE.MeshStandardMaterial({ color: 0x111111 })
        );
        barrel.rotateX(Math.PI / 2);
        barrel.position.z = 1.25;
        barrelPivot.add(barrel);

        // --- Physics & Control Mechanics ---
        let tankPos = new THREE.Vector3(0, 0, 0);
        let tankVel = 0;
        let tankRot = 0;
        let turretRot = 0;
        let barrelPitch = 0;
        let projectiles = [];

        function lerp(a, b, t) { return a + (b - a) * t; }
        function clamp(val, min, max) { return Math.min(Math.max(val, min), max); }
        function map(val, inMin, inMax, outMin, outMax) {
            return (val - inMin) * (outMax - outMin) / (inMax - inMin) + outMin;
        }

        function getTerrainHeight(x, z) {
            const ix = Math.floor(map(x, -GRID_SIZE / 2, GRID_SIZE / 2, 0, GRID_RES - 1));
            const iz = Math.floor(map(z, -GRID_SIZE / 2, GRID_SIZE / 2, 0, GRID_RES - 1));
            if (ix < 0 || ix >= GRID_RES || iz < 0 || iz >= GRID_RES) return 0;
            return vertices[(iz * GRID_RES + ix) * 3 + 1];
        }

        function fireShell() {
            if (state.shells <= 0) return;
            state.shells--;
            hudShells.textContent = state.shells;

            const shell = new THREE.Mesh(
                new THREE.SphereGeometry(0.15),
                new THREE.MeshBasicMaterial({ color: 0xffff00 })
            );

            const dir = new THREE.Vector3(0, 0, 1);
            dir.applyQuaternion(barrelPivot.quaternion);
            dir.applyQuaternion(tankGroup.quaternion);

            const startPos = new THREE.Vector3().setFromMatrixPosition(barrel.matrixWorld);
            shell.position.copy(startPos);

            projectiles.push({
                mesh: shell,
                vel: dir.multiplyScalar(25),
                life: 5
            });
            scene.add(shell);
        }

        // --- Interaction Handling ---
        const pointer = { x: 0, y: 0, isDown: false };
        let wasDown = false;

        container.addEventListener('pointerdown', (e) => {
            pointer.isDown = true;
            pointer.x = e.clientX;
            pointer.y = e.clientY - container.offsetTop;

            const w = container.clientWidth;
            if (pointer.x > w * 0.8) {
                fireShell();
            }
        });

        container.addEventListener('pointermove', (e) => {
            if (pointer.isDown) {
                pointer.x = e.clientX;
                pointer.y = e.clientY - container.offsetTop;
            }
        });

        window.addEventListener('pointerup', () => { pointer.isDown = false; });
        window.addEventListener('pointercancel', () => { pointer.isDown = false; });

        // --- UI Input Listeners ---
        sliderSeed.addEventListener('input', (e) => {
            state.seed = parseFloat(e.target.value);
            valSeed.textContent = state.seed;
            generateTerrain();
        });

        sliderRoughness.addEventListener('input', (e) => {
            state.roughness = parseFloat(e.target.value);
            valRoughness.textContent = state.roughness;
            generateTerrain();
        });

        btnReset.addEventListener('click', () => {
            generateTerrain();
            state.shells = 9999;
            hudShells.textContent = state.shells;
        });

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // --- Main Render Loop ---
        let lastTime = performance.now();

        function animate(currentTime) {
            requestAnimationFrame(animate);

            const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;

            const w = container.clientWidth;
            const h = container.clientHeight;

            // Drive & Aim Logic
            if (pointer.isDown) {
                const ndcX = (pointer.x / w) * 2 - 1;
                const ndcY = -(pointer.y / h) * 2 + 1;

                if (ndcX < 0) { // Left half = Driving
                    tankVel = lerp(tankVel, ndcY * 8, dt * 5);
                    tankRot -= ndcX * 2 * dt;
                } else { // Right half = Aiming
                    turretRot -= (ndcX - 0.5) * 4 * dt;
                    barrelPitch = clamp(barrelPitch + ndcY * dt, -0.2, 0.6);
                }
            } else {
                tankVel *= 0.95;
            }

            // Tank Movement
            tankGroup.rotation.y = tankRot;
            tankPos.x += Math.sin(tankRot) * tankVel * dt;
            tankPos.z += Math.cos(tankRot) * tankVel * dt;

            tankPos.x = clamp(tankPos.x, -18, 18);
            tankPos.z = clamp(tankPos.z, -18, 18);

            const groundY = getTerrainHeight(tankPos.x, tankPos.z);
            tankPos.y = lerp(tankPos.y, groundY, dt * 10);
            tankGroup.position.copy(tankPos);

            // Slope Adjustment
            const aheadY = getTerrainHeight(tankPos.x + Math.sin(tankRot) * 0.5, tankPos.z + Math.cos(tankRot) * 0.5);
            const pitch = Math.atan2(tankPos.y - aheadY, 0.5);
            hull.rotation.x = lerp(hull.rotation.x, pitch, dt * 5);

            turret.rotation.y = turretRot;
            barrelPivot.rotation.y = turretRot;
            barrelPivot.rotation.x = -barrelPitch;

            // Projectile Motion
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.vel.y -= 9.8 * dt;
                p.mesh.position.addScaledVector(p.vel, dt);
                p.life -= dt;

                const groundAtP = getTerrainHeight(p.mesh.position.x, p.mesh.position.z);
                if (p.mesh.position.y <= groundAtP || p.life < 0) {
                    if (p.mesh.position.y <= groundAtP + 0.5) {
                        applyDeformation(p.mesh.position, 1.8, 0.8);
                    }
                    scene.remove(p.mesh);
                    projectiles.splice(i, 1);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
