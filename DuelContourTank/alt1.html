<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual Contour Tank Simulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a1e; color: #ffffff;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        header {
            padding: 12px 20px; background: #25252b;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #383842;
        }
        #viewport-container { flex: 1; position: relative; width: 100%; background: #000; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        .instructions {
            position: absolute; bottom: 12px; left: 12px;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
            padding: 8px 12px; border-radius: 6px; font-size: 0.75rem; color: #ccc;
            pointer-events: none;
        }
        .controls-panel {
            padding: 12px 20px; background: #25252b; border-top: 1px solid #383842;
            display: flex; gap: 20px; align-items: center;
        }
        button {
            background: #4fa0ff; color: #000; border: none; padding: 6px 14px;
            border-radius: 6px; font-weight: 600; cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <header>
        <h1>Dual Contour Volumetric Terrain</h1>
        <div>Shells: <span id="hud-shells">9999</span></div>
    </header>

    <div id="viewport-container">
        <div class="instructions">
            Left side: Drive &bull; Right side: Aim &bull; Tap Right: Fire & Dig Volume
        </div>
    </div>

    <div class="controls-panel">
        <button id="btn-reset">Reset Volumetric Grid</button>
    </div>

    <script>
        // --- Dual Contouring Subsystem ---
        class DualContourTerrain {
            constructor(dimX, dimY, dimZ, scale) {
                this.dimX = dimX;
                this.dimY = dimY;
                this.dimZ = dimZ;
                this.scale = scale;
                this.grid = new Float32Array(dimX * dimY * dimZ);
                this.mesh = null;
                this.initGrid();
            }

            getIndex(x, y, z) {
                return x + y * this.dimX + z * this.dimX * this.dimY;
            }

            initGrid() {
                for (let z = 0; z < this.dimZ; z++) {
                    for (let y = 0; y < this.dimY; y++) {
                        for (let x = 0; x < this.dimX; x++) {
                            const worldY = (y - this.dimY / 2) * this.scale;
                            const worldX = (x - this.dimX / 2) * this.scale;
                            const worldZ = (z - this.dimZ / 2) * this.scale;

                            // 3D Terrain SDF (Ground plane + sinusoidal hills)
                            let density = worldY - (Math.sin(worldX * 0.2) * 2.0 + Math.cos(worldZ * 0.2) * 2.0);
                            
                            // Bottom floor closing boundary
                            if (y === 0) density = -1.0; 

                            this.grid[this.getIndex(x, y, z)] = density;
                        }
                    }
                }
            }

            // Subtractive SDF sphere deformation for terrain digging
            carveSphere(center, radius) {
                let modified = false;
                for (let z = 0; z < this.dimZ; z++) {
                    for (let y = 0; y < this.dimY; y++) {
                        for (let x = 0; x < this.dimX; x++) {
                            const wx = (x - this.dimX / 2) * this.scale;
                            const wy = (y - this.dimY / 2) * this.scale;
                            const wz = (z - this.dimZ / 2) * this.scale;

                            const dist = Math.sqrt((wx - center.x)**2 + (wy - center.y)**2 + (wz - center.z)**2);
                            if (dist < radius) {
                                const idx = this.getIndex(x, y, z);
                                const carveDensity = radius - dist;
                                // Union / Subtract field
                                this.grid[idx] = Math.max(this.grid[idx], carveDensity);
                                modified = true;
                            }
                        }
                    }
                }
                if (modified) this.generateMesh();
            }

            generateMesh() {
                const positions = [];
                const normals = [];
                const indices = [];
                const cellVertices = new Int32Array(this.dimX * this.dimY * this.dimZ).fill(-1);

                // Step 1: Vertex Placement per active grid cell
                for (let z = 0; z < this.dimZ - 1; z++) {
                    for (let y = 0; y < this.dimY - 1; y++) {
                        for (let x = 0; x < this.dimX - 1; x++) {
                            let hasInside = false, hasOutside = false;
                            
                            for (let dz = 0; dz <= 1; dz++) {
                                for (let dy = 0; dy <= 1; dy++) {
                                    for (let dx = 0; dx <= 1; dx++) {
                                        const d = this.grid[this.getIndex(x + dx, y + dy, z + dz)];
                                        if (d < 0) hasInside = true;
                                        else hasOutside = true;
                                    }
                                }
                            }

                            if (hasInside && hasOutside) {
                                const idx = positions.length / 3;
                                cellVertices[this.getIndex(x, y, z)] = idx;

                                const px = (x + 0.5 - this.dimX / 2) * this.scale;
                                const py = (y + 0.5 - this.dimY / 2) * this.scale;
                                const pz = (z + 0.5 - this.dimZ / 2) * this.scale;

                                positions.push(px, py, pz);

                                // Finite difference normal calculation
                                const eps = 0.5;
                                const nx = this.sample(px + eps, py, pz) - this.sample(px - eps, py, pz);
                                const ny = this.sample(px, py + eps, pz) - this.sample(px, py - eps, pz);
                                const nz = this.sample(px, py, pz + eps) - this.sample(px, py, pz - eps);
                                const norm = new THREE.Vector3(nx, ny, nz).normalize();

                                normals.push(norm.x, norm.y, norm.z);
                            }
                        }
                    }
                }

                // Step 2: Edge Connections (X, Y, Z quads)
                for (let z = 1; z < this.dimZ - 1; z++) {
                    for (let y = 1; y < this.dimY - 1; y++) {
                        for (let x = 1; x < this.dimX - 1; x++) {
                            const d0 = this.grid[this.getIndex(x, y, z)];

                            // X-Edge
                            if ((d0 < 0) !== (this.grid[this.getIndex(x + 1, y, z)] < 0)) {
                                const c0 = cellVertices[this.getIndex(x, y - 1, z - 1)];
                                const c1 = cellVertices[this.getIndex(x, y, z - 1)];
                                const c2 = cellVertices[this.getIndex(x, y, z)];
                                const c3 = cellVertices[this.getIndex(x, y - 1, z)];
                                if (c0 !== -1 && c1 !== -1 && c2 !== -1 && c3 !== -1) {
                                    if (d0 < 0) indices.push(c0, c1, c2, c0, c2, c3);
                                    else indices.push(c0, c2, c1, c0, c3, c2);
                                }
                            }
                        }
                    }
                }

                const geom = new THREE.BufferGeometry();
                geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
                geom.setIndex(indices);

                if (!this.mesh) {
                    const mat = new THREE.MeshStandardMaterial({ color: 0x4fa0ff, roughness: 0.6, flatShading: true, side: THREE.DoubleSide });
                    this.mesh = new THREE.Mesh(geom, mat);
                } else {
                    this.mesh.geometry.dispose();
                    this.mesh.geometry = geom;
                }
                return this.mesh;
            }

            sample(wx, wy, wz) {
                const gx = Math.round(wx / this.scale + this.dimX / 2);
                const gy = Math.round(wy / this.scale + this.dimY / 2);
                const gz = Math.round(wz / this.scale + this.dimZ / 2);
                if (gx < 0 || gx >= this.dimX || gy < 0 || gy >= this.dimY || gz < 0 || gz >= this.dimZ) return 1.0;
                return this.grid[this.getIndex(gx, gy, gz)];
            }
        }

        // --- App Setup ---
        const container = document.getElementById('viewport-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1e);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(30, 25, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(20, 40, 20);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 1.5));

        // Create Volumetric Subsystem
        const terrain = new DualContourTerrain(32, 20, 32, 1.2);
        scene.add(terrain.generateMesh());

        // Simple Target Raycast Handler
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        container.addEventListener('pointerdown', (e) => {
            if (e.clientX > container.clientWidth * 0.7) {
                mouse.x = (e.clientX / container.clientWidth) * 2 - 1;
                mouse.y = -(e.clientY / container.clientHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(terrain.mesh);

                if (intersects.length > 0) {
                    const hitPoint = intersects[0].point;
                    terrain.carveSphere(hitPoint, 3.5); // Carve true 3D spherical crater
                }
            }
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            terrain.initGrid();
            terrain.generateMesh();
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
