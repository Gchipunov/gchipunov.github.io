<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D WebGL Village</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: sans-serif; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
        }
        #info h1 { margin: 0 0 5px 0; font-size: 18px; }
        #info p { margin: 0; font-size: 12px; color: #ccc; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="info">
        <h1>Medieval Village</h1>
        <p>Rotate: Left Click + Drag | Pan: Right Click + Drag | Zoom: Scroll</p>
    </div>

    <script>
        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 25, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevents camera going underground

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 0.8);
        sunLight.position.set(40, 60, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 150;
        const d = 40;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        scene.add(sunLight);

        // --- Materials ---
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.8 });
        const darkWoodMat = new THREE.MeshStandardMaterial({ color: 0x3d2817, roughness: 0.9 });
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x707070, roughness: 0.9 });
        const redMat = new THREE.MeshStandardMaterial({ color: 0x8b0000, roughness: 0.7 });
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x3a2510, roughness: 0.8 });
        const windowMat = new THREE.MeshBasicMaterial({ color: 0xffdb6d });
        const metalMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.2 });

        // --- Terrain & Paths ---
        const groundGeo = new THREE.PlaneGeometry(120, 120);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x557a2b, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Crossroads (Dirt path)
        const pathMat = new THREE.MeshStandardMaterial({ color: 0x8a6d3b, roughness: 1.0 });
        const path1 = new THREE.Mesh(new THREE.PlaneGeometry(10, 80), pathMat);
        path1.rotation.x = -Math.PI / 2;
        path1.position.y = 0.01;
        path1.receiveShadow = true;
        scene.add(path1);

        const path2 = new THREE.Mesh(new THREE.PlaneGeometry(80, 10), pathMat);
        path2.rotation.x = -Math.PI / 2;
        path2.position.y = 0.01;
        path2.receiveShadow = true;
        scene.add(path2);

        // --- Helper Function: Roof Generator ---
        function createPitchedRoof(width, depth, height, material) {
            const shape = new THREE.Shape();
            shape.moveTo(-width / 2, 0);
            shape.lineTo(0, height);
            shape.lineTo(width / 2, 0);
            shape.closePath();

            const extrudeSettings = { depth: depth, bevelEnabled: false };
            const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            const mesh = new THREE.Mesh(geo, material);
            mesh.position.z = -depth / 2;
            mesh.castShadow = true;
            return mesh;
        }

        // --- Buildings ---

        // 1. BARN
        function createBarn() {
            const group = new THREE.Group();
            
            // Main structure
            const body = new THREE.Mesh(new THREE.BoxGeometry(10, 6, 14), redMat);
            body.position.y = 3;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Roof
            const roof = createPitchedRoof(11, 15, 4, roofMat);
            roof.position.y = 6;
            group.add(roof);

            // White Barn Doors
            const doorMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee });
            const doorLeft = new THREE.Mesh(new THREE.BoxGeometry(2, 4, 0.2), doorMat);
            doorLeft.position.set(-1, 2, 7.05);
            const doorRight = doorLeft.clone();
            doorRight.position.x = 1;
            group.add(doorLeft, doorRight);

            group.position.set(-20, 0, -18);
            return group;
        }

        // 2. BLACKSMITH
        function createBlacksmith() {
            const group = new THREE.Group();

            // Stone base structure
            const body = new THREE.Mesh(new THREE.BoxGeometry(8, 5, 8), stoneMat);
            body.position.y = 2.5;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Open lean-to roof
            const roof = createPitchedRoof(9, 9, 3, darkWoodMat);
            roof.position.y = 5;
            group.add(roof);

            // Chimney
            const chimney = new THREE.Mesh(new THREE.BoxGeometry(2, 9, 2), stoneMat);
            chimney.position.set(3, 4.5, -2);
            chimney.castShadow = true;
            group.add(chimney);

            // Forge fire glow
            const forgeGlow = new THREE.PointLight(0xff5500, 1.5, 8);
            forgeGlow.position.set(0, 1.5, 4.5);
            group.add(forgeGlow);

            // Anvil outside
            const anvilBase = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), darkWoodMat);
            anvilBase.position.set(-2, 0.4, 5.5);
            const anvilTop = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 1.2), metalMat);
            anvilTop.position.set(-2, 1, 5.5);
            anvilTop.castShadow = true;
            group.add(anvilBase, anvilTop);

            group.position.set(18, 0, -18);
            return group;
        }

        // 3. TOWN HALL
        function createTownHall() {
            const group = new THREE.Group();

            // Grand main structure
            const body = new THREE.Mesh(new THREE.BoxGeometry(14, 8, 12), stoneMat);
            body.position.y = 4;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Main roof
            const roof = createPitchedRoof(15, 13, 5, roofMat);
            roof.position.y = 8;
            group.add(roof);

            // Bell/Clock Tower
            const tower = new THREE.Mesh(new THREE.BoxGeometry(4, 14, 4), stoneMat);
            tower.position.set(0, 7, 4);
            tower.castShadow = true;
            group.add(tower);

            // Tower Spire
            const spireGeo = new THREE.ConeGeometry(3.5, 6, 4);
            const spire = new THREE.Mesh(spireGeo, redMat);
            spire.position.set(0, 17, 4);
            spire.rotation.y = Math.PI / 4;
            spire.castShadow = true;
            group.add(spire);

            // Entrance Pillars
            for(let x of [-4, -2, 2, 4]) {
                const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 5), stoneMat);
                pillar.position.set(x, 2.5, 6.5);
                pillar.castShadow = true;
                group.add(pillar);
            }

            // Big Door
            const door = new THREE.Mesh(new THREE.BoxGeometry(3, 4.5, 0.2), darkWoodMat);
            door.position.set(0, 2.25, 6.05);
            group.add(door);

            group.position.set(0, 0, -22);
            return group;
        }

        // 4. INN
        function createInn() {
            const group = new THREE.Group();

            // Ground Floor (Stone)
            const groundFloor = new THREE.Mesh(new THREE.BoxGeometry(12, 5, 10), stoneMat);
            groundFloor.position.y = 2.5;
            groundFloor.castShadow = true;
            group.add(groundFloor);

            // Second Floor (Wood - Overhanging slightly)
            const secondFloor = new THREE.Mesh(new THREE.BoxGeometry(13, 5, 11), woodMat);
            secondFloor.position.y = 7.5;
            secondFloor.castShadow = true;
            group.add(secondFloor);

            // Roof
            const roof = createPitchedRoof(14, 12, 4, roofMat);
            roof.position.y = 10;
            group.add(roof);

            // Glowing Windows
            const winGeo = new THREE.PlaneGeometry(1, 1.2);
            for (let x of [-3, 3]) {
                const win = new THREE.Mesh(winGeo, windowMat);
                win.position.set(x, 7.5, 5.56);
                group.add(win);
            }

            // Inn Signpost
            const post = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 4), woodMat);
            post.position.set(7, 2, 5);
            const sign = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1, 0.1), darkWoodMat);
            sign.position.set(6.3, 3.5, 5);
            group.add(post, sign);

            group.position.set(-20, 0, 18);
            return group;
        }

        // 5. BAR / TAVERN
        function createBar() {
            const group = new THREE.Group();

            // Main rustic body
            const body = new THREE.Mesh(new THREE.BoxGeometry(10, 5, 10), darkWoodMat);
            body.position.y = 2.5;
            body.castShadow = true;
            group.add(body);

            // Roof
            const roof = createPitchedRoof(11, 11, 3.5, roofMat);
            roof.position.y = 5;
            group.add(roof);

            // Porch Deck & Canopy
            const deck = new THREE.Mesh(new THREE.BoxGeometry(10, 0.4, 4), woodMat);
            deck.position.set(0, 0.2, 7);
            group.add(deck);

            const canopy = new THREE.Mesh(new THREE.BoxGeometry(10, 0.2, 4), roofMat);
            canopy.position.set(0, 4, 7);
            group.add(canopy);

            // Porch Support Posts
            for(let x of [-4.5, 0, 4.5]) {
                const post = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 3.8), woodMat);
                post.position.set(x, 2, 8.8);
                group.add(post);
            }

            // Outside Barrels
            const barrelGeo = new THREE.CylinderGeometry(0.6, 0.6, 1.4, 12);
            const b1 = new THREE.Mesh(barrelGeo, woodMat);
            b1.position.set(-3, 1, 7.5);
            b1.castShadow = true;
            const b2 = new THREE.Mesh(barrelGeo, woodMat);
            b2.position.set(-2, 0.7, 7.5);
            b2.rotation.z = Math.PI / 2; // Knocked over barrel
            b2.castShadow = true;
            group.add(b1, b2);

            group.position.set(18, 0, 18);
            return group;
        }

        // --- Environment Details (Trees & Decor) ---
        function createTree(x, z) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 3), woodMat);
            trunk.position.y = 1.5;
            trunk.castShadow = true;

            const foliageMat = new THREE.MeshStandardMaterial({ color: 0x2e5a1c, roughness: 0.8 });
            const foliage = new THREE.Mesh(new THREE.ConeGeometry(2.5, 6, 6), foliageMat);
            foliage.position.y = 5;
            foliage.castShadow = true;

            tree.add(trunk, foliage);
            tree.position.set(x, 0, z);
            scene.add(tree);
        }

        // Add buildings to scene
        scene.add(createBarn());
        scene.add(createBlacksmith());
        scene.add(createTownHall());
        scene.add(createInn());
        scene.add(createBar());

        // Add peripheral trees
        const treeLocations = [
            [-35, -30], [-30, 5], [-35, 30], [35, -30], [30, 0], [35, 30],
            [-10, -35], [10, -35], [-5, 35], [12, 35]
        ];
        treeLocations.forEach(loc => createTree(loc[0], loc[1]));

        // --- Window Resize Handling ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
