<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concrete Commander - Crane & Conveyor Update</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #hud-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 160px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0));
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }
        .panel {
            background: rgba(20, 30, 40, 0.85);
            border: 2px solid #4a90e2;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            gap: 10px;
            box-shadow: 0 0 20px rgba(74, 144, 226, 0.3);
            backdrop-filter: blur(5px);
            transition: opacity 0.3s;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
        button {
            background: linear-gradient(to bottom, #3a4a5a, #2a3a4a);
            color: white;
            border: 1px solid #5a6a7a;
            padding: 10px 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            width: 100px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            text-transform: uppercase;
            text-align: center;
        }
        button:hover {
            background: #4a90e2;
            border-color: #7ab0f2;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        button:active {
            transform: translateY(1px);
        }
        button.active {
            background: #4a90e2;
            border-color: #fff;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .icon {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .warning-btn { border-color: #e2a04a; color: #ffddaa; }
        .warning-btn:hover { background: #e28a4a; border-color: #ffc288; }
        
        #info-box {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #4a90e2;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 4px;
            pointer-events: none;
        }
        #stats-box {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #55ff55;
            background: rgba(0,0,0,0.8);
            border: 1px solid #55ff55;
            padding: 15px;
            border-radius: 4px;
            pointer-events: none;
            font-size: 20px;
            font-weight: bold;
        }
        #cursor-tooltip {
            position: absolute;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            pointer-events: none;
            display: none;
            font-size: 12px;
            z-index: 1000;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div id="info-box">
            <h3>Mission Control</h3>
            <p>1. Deploy MCV to build Base</p>
            <p>2. Build a Factory (Refinery)</p>
            <p>3. Train Harvesters to collect spheres</p>
            <p>4. Watch cranes & conveyors in action</p>
        </div>

        <div id="stats-box">
            Credits: <span id="ui-credits">500</span>c
        </div>

        <div id="hud-bottom">
            <div id="panel-mcv" class="panel hidden">
                <div style="color:white; margin-right:10px; width: 100px;">
                    <h3>MCV</h3>
                    <small>Mobile Construction Vehicle</small>
                </div>
                <button id="btn-reverse">
                    <span class="icon">🔄</span>Reverse
                </button>
                <button id="btn-deploy">
                    <span class="icon">🏗️</span>Deploy
                </button>
            </div>

            <div id="panel-base" class="panel hidden">
                <div style="color:white; margin-right:10px; width: 100px;">
                    <h3>Const. Yard</h3>
                    <small>Main Base</small>
                </div>
                <button id="btn-power">
                    <span class="icon">⚡</span>Power (50c)
                </button>
                <button id="btn-refinery">
                    <span class="icon">🏭</span>Factory (200c)
                </button>
                <button id="btn-harvester">
                    <span class="icon">🚜</span>Harvester (100c)
                </button>
                <button id="btn-undeploy" class="warning-btn">
                    <span class="icon">🚚</span>Pack Up
                </button>
            </div>
        </div>
        <div id="cursor-tooltip"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- GAME CONFIGURATION ---
        const COLORS = {
            ground: 0x2a2a2a,
            grid: 0x444444,
            selection: 0x00ff00,
            mcvBody: 0xffaa00,
            base: 0xffcc00,
            power: 0x44ff44,
            factory: 0xff4444,
            enemy: 0xff3333,
            harvester: 0x2266cc,
            ore: 0x22ff22 // Green sphere resource
        };

        const GRID_SIZE = 100;
        const TILE_SIZE = 5;
        const GRID_DIM = 21;

        // --- GLOBAL VARIABLES ---
        let scene, camera, renderer, controls, raycaster;
        let mouse = new THREE.Vector2();
        let groundPlane;
        
        let navGrid = [];
        let units = [];
        let buildings = [];
        let enemies = []; 
        let resourceSpheres = [];
        let effects = [];
        
        let selectedEntity = null;
        let placementMode = null;
        
        let credits = 500;
        let reverseMode = false;
        let clock = new THREE.Clock();

        function updateCredits(amt) {
            credits += amt;
            document.getElementById('ui-credits').innerText = credits;
        }

        // --- PATHFINDING UTILITIES ---
        function initGrid() {
            navGrid = new Array(GRID_DIM).fill(0).map(() => new Array(GRID_DIM).fill(false));
        }

        function worldToGrid(x, z) {
            const gx = Math.round((x + (GRID_SIZE/2)) / TILE_SIZE);
            const gz = Math.round((z + (GRID_SIZE/2)) / TILE_SIZE);
            return { x: gx, z: gz };
        }

        function gridToWorld(gx, gz) {
            const wx = (gx * TILE_SIZE) - (GRID_SIZE/2);
            const wz = (gz * TILE_SIZE) - (GRID_SIZE/2);
            return new THREE.Vector3(wx, 0, wz);
        }

        function setObstacle(worldPos, isBlocked) {
            const { x, z } = worldToGrid(worldPos.x, worldPos.z);
            if (x >= 0 && x < GRID_DIM && z >= 0 && z < GRID_DIM) {
                navGrid[x][z] = isBlocked;
            }
        }

        function isWalkable(gx, gz) {
            if (gx < 0 || gx >= GRID_DIM || gz < 0 || gz >= GRID_DIM) return false;
            return !navGrid[gx][gz];
        }

        // Simple steering pathfinder for Harvesters (to avoid grid getting fully stuck)
        function findPath(startPos, endPos) {
            return [endPos]; // Simplified for this demo so harvesters drive straight to targets
        }

        // --- INITIALIZATION ---
        function init() {
            initGrid();

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x101015);
            scene.fog = new THREE.FogExp2(0x101015, 0.008);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(-30, 40, 40);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.1;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            const planeGeometry = new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE);
            const planeMaterial = new THREE.MeshStandardMaterial({ color: COLORS.ground, roughness: 0.8 });
            groundPlane = new THREE.Mesh(planeGeometry, planeMaterial);
            groundPlane.rotation.x = -Math.PI / 2;
            groundPlane.receiveShadow = true;
            scene.add(groundPlane);

            const gridHelper = new THREE.GridHelper(GRID_SIZE, 20, COLORS.grid, COLORS.grid);
            scene.add(gridHelper);

            raycaster = new THREE.Raycaster();

            // Spawn Initial Entities
            spawnMCV(new THREE.Vector3(0, 0, 0));
            
            // Spawn Resource Spheres (btBall stand-ins)
            for(let i=0; i<40; i++) {
                let x = (Math.random() * 80) - 40;
                let z = (Math.random() * 80) - 40;
                if (Math.abs(x) < 15 && Math.abs(z) < 15) continue; // Keep center clear
                spawnResourceSphere(new THREE.Vector3(x, 0.5, z));
            }

            // Events
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('contextmenu', (e) => e.preventDefault());

            // UI Listeners
            document.getElementById('btn-deploy').addEventListener('click', () => { if(selectedEntity?.type==='MCV') selectedEntity.deploy(); });
            document.getElementById('btn-undeploy').addEventListener('click', () => { if(selectedEntity?.type==='Base') selectedEntity.packUp(); }); 
            document.getElementById('btn-power').addEventListener('click', () => startPlacement('power', 50));
            document.getElementById('btn-refinery').addEventListener('click', () => startPlacement('factory', 200));
            document.getElementById('btn-harvester').addEventListener('click', spawnHarvesterFromBase);
            
            const btnReverse = document.getElementById('btn-reverse');
            btnReverse.addEventListener('click', () => {
                reverseMode = !reverseMode;
                btnReverse.classList.toggle('active', reverseMode);
            });

            animate();
        }

        // --- ASSETS & MESHES ---

        function spawnResourceSphere(pos) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), new THREE.MeshStandardMaterial({color: COLORS.ore}));
            m.position.copy(pos);
            m.castShadow = true;
            scene.add(m);
            resourceSpheres.push({ mesh: m, active: true });
        }

        function createSelectionRing(size = 2.5) {
            const geometry = new THREE.RingGeometry(size, size + 0.5, 32);
            const material = new THREE.MeshBasicMaterial({ color: COLORS.selection, transparent: true, opacity: 0.6, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.y = 0.1;
            mesh.visible = false;
            return mesh;
        }

        function createHarvesterMesh() {
            const group = new THREE.Group();
            // Chassis
            const base = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 3.5), new THREE.MeshStandardMaterial({color: COLORS.harvester}));
            base.position.y = 0.8; base.castShadow = true; group.add(base);
            // Cab
            const cab = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.2, 1), new THREE.MeshStandardMaterial({color: 0x111111}));
            cab.position.set(0, 1.8, 1); cab.castShadow = true; group.add(cab);
            
            // Crane Rig Assembly
            const cranePivot = new THREE.Group();
            cranePivot.position.set(0, 1.4, -0.5); // Center of flatbed
            
            // Vertical rotating mast
            const craneMast = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.8), new THREE.MeshStandardMaterial({color: 0xddaa00}));
            craneMast.position.y = 0.4;
            cranePivot.add(craneMast);

            // Up/Down articulating arm
            const armPivot = new THREE.Group();
            armPivot.position.y = 0.8;
            craneMast.add(armPivot);

            const armMesh = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.5, 0.2), new THREE.MeshStandardMaterial({color: 0xdddd00}));
            armMesh.position.set(0, 1.25, 0);
            armPivot.add(armMesh);

            // Claw/Magnet
            const magnet = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.2), new THREE.MeshStandardMaterial({color: 0x333333}));
            magnet.position.set(0, 2.6, 0);
            armPivot.add(magnet);

            group.add(cranePivot);

            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 12);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            [[-1.1,0.5,1.2],[1.1,0.5,1.2],[-1.1,0.5,-1.2],[1.1,0.5,-1.2]].forEach(pos => {
                const w = new THREE.Mesh(wheelGeo, wheelMat); w.rotation.z = Math.PI/2; w.position.set(...pos); w.castShadow = true; group.add(w);
            });

            group.userData.cranePivot = cranePivot;
            group.userData.armPivot = armPivot;
            group.userData.magnet = magnet;
            return group;
        }

        // --- CLASSES ---

        class Harvester {
            constructor(pos) {
                this.type = 'Harvester';
                this.mesh = createHarvesterMesh();
                this.mesh.position.copy(pos);
                this.selectionRing = createSelectionRing(2);
                this.mesh.add(this.selectionRing);
                scene.add(this.mesh);
                this.mesh.userData.entity = this;
                
                this.state = 'IDLE'; // SEEK, GATHER, RETURN, DUMP
                this.targetSphere = null;
                this.targetFactory = null;
                this.timer = 0;
                this.speed = 8;
                
                // Visual carried ore
                this.carriedOre = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), new THREE.MeshStandardMaterial({color: COLORS.ore}));
                this.carriedOre.visible = false;
                this.mesh.userData.magnet.add(this.carriedOre); // Attach to magnet end
            }

            update(dt) {
                const cranePivot = this.mesh.userData.cranePivot;
                const armPivot = this.mesh.userData.armPivot;

                if (this.state === 'IDLE') {
                    // Find closest ore
                    let closest = null;
                    let minDist = Infinity;
                    resourceSpheres.forEach(s => {
                        if (s.active) {
                            let d = this.mesh.position.distanceTo(s.mesh.position);
                            if (d < minDist) { minDist = d; closest = s; }
                        }
                    });
                    if (closest) {
                        this.targetSphere = closest;
                        this.targetSphere.active = false; // Claim it
                        this.state = 'SEEK';
                    }
                }
                
                else if (this.state === 'SEEK') {
                    if (!this.targetSphere) { this.state = 'IDLE'; return; }
                    const diff = new THREE.Vector3().subVectors(this.targetSphere.mesh.position, this.mesh.position);
                    diff.y = 0;
                    if (diff.length() < 2.5) {
                        this.state = 'GATHER';
                        this.timer = 0;
                    } else {
                        // Drive towards it
                        const dir = diff.normalize();
                        this.mesh.rotation.y = Math.atan2(dir.x, dir.z);
                        this.mesh.position.add(dir.multiplyScalar(this.speed * dt));
                    }
                }
                
                else if (this.state === 'GATHER') {
                    this.timer += dt;
                    
                    // Kinematic Crane Animation to pick up Ball
                    // Rotate mast towards ball
                    const localTarget = this.mesh.worldToLocal(this.targetSphere.mesh.position.clone());
                    cranePivot.rotation.y = Math.atan2(localTarget.x, localTarget.z);
                    
                    // Articulate Arm Down then Up
                    if (this.timer < 0.5) {
                        armPivot.rotation.x = THREE.MathUtils.lerp(0, Math.PI/2, this.timer * 2);
                    } else if (this.timer >= 0.5 && this.timer < 1.0) {
                        if (!this.carriedOre.visible) {
                            // Grab it physically
                            this.carriedOre.visible = true;
                            scene.remove(this.targetSphere.mesh);
                        }
                        armPivot.rotation.x = THREE.MathUtils.lerp(Math.PI/2, -Math.PI/4, (this.timer - 0.5) * 2);
                    } else {
                        this.state = 'RETURN';
                    }
                }

                else if (this.state === 'RETURN') {
                    // Find Factory
                    if (!this.targetFactory) {
                        const factories = buildings.filter(b => b.type === 'factory');
                        if (factories.length === 0) { this.state = 'IDLE'; return; }
                        this.targetFactory = factories[0];
                    }

                    // Target the start of the Conveyor Belt (local front of factory)
                    const factoryFront = new THREE.Vector3(0, 0, 4);
                    factoryFront.applyMatrix4(this.targetFactory.mesh.matrixWorld);

                    const diff = new THREE.Vector3().subVectors(factoryFront, this.mesh.position);
                    diff.y = 0;

                    if (diff.length() < 2.5) {
                        this.state = 'DUMP';
                        this.timer = 0;
                    } else {
                        const dir = diff.normalize();
                        this.mesh.rotation.y = Math.atan2(dir.x, dir.z);
                        this.mesh.position.add(dir.multiplyScalar(this.speed * dt));
                        // Re-center crane over bed
                        cranePivot.rotation.y = THREE.MathUtils.lerp(cranePivot.rotation.y, Math.PI, dt * 2);
                    }
                }

                else if (this.state === 'DUMP') {
                    this.timer += dt;
                    
                    // Turn crane towards conveyor
                    const factoryFront = new THREE.Vector3(0, 0, 4);
                    factoryFront.applyMatrix4(this.targetFactory.mesh.matrixWorld);
                    const localTarget = this.mesh.worldToLocal(factoryFront);
                    cranePivot.rotation.y = THREE.MathUtils.lerp(cranePivot.rotation.y, Math.atan2(localTarget.x, localTarget.z), dt * 5);

                    if (this.timer < 0.5) {
                        armPivot.rotation.x = THREE.MathUtils.lerp(-Math.PI/4, Math.PI/2, this.timer * 2);
                    } else {
                        if (this.carriedOre.visible) {
                            this.carriedOre.visible = false;
                            // Drop Ore onto the factory's conveyor belt
                            this.targetFactory.receiveOre();
                        }
                        armPivot.rotation.x = THREE.MathUtils.lerp(Math.PI/2, 0, (this.timer - 0.5) * 2);
                        if (this.timer > 1.0) {
                            this.state = 'IDLE';
                            this.targetFactory = null;
                            this.targetSphere = null;
                        }
                    }
                }
            }

            setSelected(bool) { this.selectionRing.visible = bool; }
        }

        // --- MCV & BUILDINGS ---
        // (MCV logic simplified from previous version for space, focusing on new mechanics)

        class MCV {
            constructor(pos) {
                this.type = 'MCV';
                
                const group = new THREE.Group();
                const body = new THREE.Mesh(new THREE.BoxGeometry(2, 1.5, 4), new THREE.MeshStandardMaterial({ color: COLORS.mcvBody }));
                body.position.y = 1.25; group.add(body);
                
                this.mesh = group;
                this.mesh.position.copy(pos);
                this.selectionRing = createSelectionRing();
                this.mesh.add(this.selectionRing);
                scene.add(this.mesh);
                this.mesh.userData.entity = this;
                
                this.path = [];
                this.isMoving = false;
            }

            move(targetPoint, inReverse) {
                this.path = [targetPoint]; // Simplified straight line
                this.isMoving = true;
                createClickEffect(targetPoint);
            }

            update(dt) {
                if (this.isMoving && this.path.length > 0) {
                    const diff = new THREE.Vector3().subVectors(this.path[0], this.mesh.position);
                    diff.y = 0;
                    if (diff.length() < 0.5) { this.isMoving = false; return; }
                    const dir = diff.normalize();
                    this.mesh.position.add(dir.multiplyScalar(10 * dt));
                    this.mesh.rotation.y = Math.atan2(dir.x, dir.z) + (reverseMode ? Math.PI : 0);
                }
            }

            deploy() {
                const pos = this.mesh.position.clone();
                scene.remove(this.mesh);
                units = units.filter(u => u !== this);
                deselect();
                const b = new Building('Base', pos);
                buildings.push(b);
                selectEntity(b);
            }

            setSelected(bool) {
                this.selectionRing.visible = bool;
                if(bool) document.getElementById('panel-mcv').classList.remove('hidden');
            }
        }

        class Building {
            constructor(type, pos) {
                this.type = type;
                this.mesh = this.createSpecificMesh(type);
                this.mesh.position.copy(pos);
                this.mesh.position.y = 0;
                setObstacle(pos, true);
                this.selectionRing = createSelectionRing(4);
                this.mesh.add(this.selectionRing);
                scene.add(this.mesh);
                this.mesh.userData.entity = this;
                
                this.conveyorItems = []; // For processing ores
            }

            createSpecificMesh(type) {
                const g = new THREE.Group();
                if(type === 'Base') {
                    const body = new THREE.Mesh(new THREE.BoxGeometry(4,3,4), new THREE.MeshStandardMaterial({color:COLORS.base}));
                    body.position.y = 1.5; body.castShadow = true; g.add(body);
                } else if(type === 'power') {
                    const c = new THREE.Mesh(new THREE.CylinderGeometry(1.5,2,4,16), new THREE.MeshStandardMaterial({color:COLORS.power}));
                    c.position.y = 2; c.castShadow = true; g.add(c);
                } else if (type === 'factory') {
                    // Refinery Building
                    const b = new THREE.Mesh(new THREE.BoxGeometry(5, 3, 4), new THREE.MeshStandardMaterial({color:COLORS.factory}));
                    b.position.y = 1.5; b.castShadow = true; g.add(b);
                    
                    // Conveyor Belt Attachment
                    const belt = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.4, 5), new THREE.MeshStandardMaterial({color:0x222222}));
                    belt.position.set(0, 0.2, 3); // Extends outwards on local Z
                    belt.castShadow = true; g.add(belt);
                    
                    // Hole for ore to drop into
                    const hole = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 1.4), new THREE.MeshStandardMaterial({color:0x000000}));
                    hole.position.set(0, 0.25, 1); g.add(hole);
                }
                return g;
            }

            receiveOre() {
                // Spawn a visual sphere on the conveyor belt
                const oreMesh = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), new THREE.MeshStandardMaterial({color: COLORS.ore}));
                oreMesh.position.set(0, 0.8, 5); // Start of belt (local coords)
                this.mesh.add(oreMesh);
                this.conveyorItems.push({ mesh: oreMesh, progress: 0 });
            }

            update(dt) {
                // Animate conveyor belt items
                if (this.type === 'factory' && this.conveyorItems.length > 0) {
                    for(let i = this.conveyorItems.length - 1; i >= 0; i--) {
                        let item = this.conveyorItems[i];
                        item.progress += dt; // Speed of conveyor
                        
                        // Slide along local Z axis from 5 to 1
                        item.mesh.position.z = 5 - (item.progress * 4);
                        
                        // Rotate to simulate rolling
                        item.mesh.rotation.x -= dt * 5;

                        // Processed!
                        if (item.progress >= 1.0) {
                            this.mesh.remove(item.mesh);
                            this.conveyorItems.splice(i, 1);
                            updateCredits(50);
                            createClickEffect(this.mesh.position, 0x55ff55); // Green flash
                        }
                    }
                }
            }

            packUp() {
                scene.remove(this.mesh);
                buildings = buildings.filter(b => b !== this);
                deselect();
                const m = spawnMCV(this.mesh.position);
                selectEntity(m);
            }

            setSelected(bool) { 
                this.selectionRing.visible = bool; 
                if (bool && this.type === 'Base') {
                    document.getElementById('panel-base').classList.remove('hidden');
                }
            }
        }

        // --- SPATIAL / INPUT ---

        function spawnMCV(pos) { const u = new MCV(pos); units.push(u); return u; }
        function spawnHarvesterFromBase() {
            if (credits >= 100 && selectedEntity && selectedEntity.type === 'Base') {
                updateCredits(-100);
                const spawnPos = selectedEntity.mesh.position.clone();
                spawnPos.z += 6; // Spawn in front of base
                const h = new Harvester(spawnPos);
                units.push(h);
            }
        }

        function onPointerDown(event) {
            if(event.target.closest('button')) return;
            mouse.x = (event.clientX/window.innerWidth)*2-1;
            mouse.y = -(event.clientY/window.innerHeight)*2+1;
            raycaster.setFromCamera(mouse, camera);

            if(placementMode && event.button===0) { placeBuilding(); return; }
            if(placementMode && event.button===2) { cancelPlacement(); return; }

            const hits = raycaster.intersectObjects([...units.map(u=>u.mesh), ...buildings.map(b=>b.mesh), groundPlane], true);
            if(hits.length>0) {
                const hit = hits[0];
                let obj = hit.object;
                while(obj.parent && !obj.userData.entity) obj = obj.parent;
                const ent = obj.userData.entity;

                if(event.button===0) {
                    if(ent) selectEntity(ent);
                    else if (hit.object===groundPlane) deselect();
                } else if (event.button===2) {
                    if(selectedEntity && selectedEntity.type==='MCV' && hit.object===groundPlane) {
                        selectedEntity.move(hit.point.clone(), reverseMode);
                    }
                }
            }
        }

        function placeBuilding() {
            if(!placementMode) return;
            if (credits < placementMode.cost) return;

            const pos = placementMode.mesh.position.clone();
            const gp = worldToGrid(pos.x, pos.z);
            if(!isWalkable(gp.x, gp.z)) return;
            
            updateCredits(-placementMode.cost);
            scene.remove(placementMode.mesh);
            buildings.push(new Building(placementMode.type, pos));
            placementMode = null;
            document.body.style.cursor='default';
            document.getElementById('cursor-tooltip').style.display='none';
        }

        function cancelPlacement() {
            if(placementMode) scene.remove(placementMode.mesh);
            placementMode = null;
            document.body.style.cursor='default';
            document.getElementById('cursor-tooltip').style.display='none';
        }

        function selectEntity(e) { deselect(); selectedEntity=e; selectedEntity.setSelected(true); }
        function deselect() { if(selectedEntity) { selectedEntity.setSelected(false); selectedEntity=null; } document.querySelectorAll('.panel').forEach(p=>p.classList.add('hidden')); }

        function startPlacement(type, cost) {
            if (credits < cost) return;
            if(placementMode) cancelPlacement();
            
            // Dummy mesh for preview
            const tempB = new Building(type, new THREE.Vector3(0,-1000,0));
            const g = tempB.mesh; 
            scene.add(g);
            g.traverse(c=>{if(c.isMesh){c.material=c.material.clone();c.material.transparent=true;c.material.opacity=0.5;}});
            
            placementMode = {type:type, mesh:g, cost: cost};
            document.body.style.cursor='crosshair';
            const tt = document.getElementById('cursor-tooltip');
            tt.style.display='block'; tt.innerText="Left Click Place | Right Click Cancel";
        }

        function createClickEffect(pos, color=0xffffff) {
            const g = new THREE.RingGeometry(0.5,1,32);
            const m = new THREE.MeshBasicMaterial({color:color, transparent:true, opacity:0.8, side:THREE.DoubleSide});
            const mesh = new THREE.Mesh(g,m);
            mesh.rotation.x = -Math.PI/2; mesh.position.copy(pos); mesh.position.y=0.2;
            scene.add(mesh);
            effects.push({mesh:mesh, age:0});
        }

        function onPointerMove(e) {
            mouse.x = (e.clientX/window.innerWidth)*2-1;
            mouse.y = -(e.clientY/window.innerHeight)*2+1;
            if(placementMode) {
                raycaster.setFromCamera(mouse,camera);
                const h = raycaster.intersectObject(groundPlane);
                if(h.length>0) {
                    const p = h[0].point;
                    placementMode.mesh.position.set(Math.round(p.x/5)*5, 0, Math.round(p.z/5)*5);
                }
            }
            const tt = document.getElementById('cursor-tooltip');
            if(tt.style.display==='block') { tt.style.left=e.clientX+15+'px'; tt.style.top=e.clientY+15+'px'; }
        }

        function onWindowResize() {
            camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            
            units.forEach(u => u.update(dt));
            buildings.forEach(b => b.update(dt));
            
            for(let i=effects.length-1; i>=0; i--) {
                const f = effects[i]; f.age+=dt; f.mesh.scale.addScalar(dt*2); f.mesh.material.opacity-=dt*2;
                if(f.age>0.5) { scene.remove(f.mesh); effects.splice(i,1); }
            }
            
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
